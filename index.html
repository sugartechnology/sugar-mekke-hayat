<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Hayat Mekke Villa Sunumu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: quiet property brochure. White page, black type, hairline rules, photographs carry the colour. Single light look by choice. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F2; --line:#E6E5E0; --fg:#1C1C1A; --muted:#6E6D67;
  --accent:#41604F; --accent-2:#33503F; --accent-ink:#FFFFFF; --accent-soft:#F2F5F2; --gold:#9A7B4F;
  --good:#3D7A55; --good-bg:transparent; --bad:#A4513C; --bad-bg:transparent; --shade:transparent;
  --f1:#41604F; --f2:#7F9A88; --f3:#B9C9BD; --f4:#DCE5DE; --fx:#D2BE97; --fv:#E4E3DE;
  --display:"Newsreader","Iowan Old Style",Georgia,serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --r:4px; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.02}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:lining-nums tabular-nums}
h1,h2,h3,.price-line b,.pcard b,.total b,.cbig b,.stats b,.bigp,.oc b{font-variant-numeric:lining-nums}
@media (max-width:560px){.items tr:not(.grp)>:nth-child(1),.items tr:not(.grp)>:nth-child(3){display:none}.items td.wrap{min-width:0}}
.wrap{max-width:1320px;margin:0 auto}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.cur{font-size:.5em;font-family:var(--body);font-weight:600;color:var(--muted);letter-spacing:.02em;margin-left:.25em}
/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:12px}
.logo{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;text-align:left}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo i::after{content:"";width:12px;height:12px;border:2px solid var(--accent-ink);transform:rotate(45deg);border-radius:2px}
.logo b{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1}
.logo small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:700;font-size:13.5px}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="true"]{color:var(--fg);background:var(--surface-2)}
.bar-actions{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{background:none;border:0;padding:5px 11px;font-size:12px;font-weight:800;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shade)}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.light{background:rgba(255,255,255,.92);border-color:transparent;color:#14171A}
.btn.ghost-light{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.link:hover{text-decoration:underline;text-underline-offset:3px}
main{padding-top:24px;display:grid;gap:64px}
section.block{display:grid;gap:22px}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h2{font-size:clamp(30px,3.6vw,44px)}
.head p{color:var(--muted);max-width:60ch;margin-top:6px}
/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:clamp(420px,64vh,660px);display:flex;align-items:flex-end;background:var(--accent)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,11,.05) 20%,rgba(8,12,11,.72) 100%)}
.hero-in{position:relative;z-index:1;padding:clamp(24px,4vw,56px);color:#fff;display:grid;gap:18px;width:100%}
.hero-in .eyebrow{color:rgba(255,255,255,.8)}
.hero-in h1{font-size:clamp(52px,9vw,128px);font-weight:500;line-height:.92;letter-spacing:-.02em}
.hero-in p{font-size:clamp(16px,1.6vw,19px);max-width:46ch;color:rgba(255,255,255,.88)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.25);padding-top:18px;margin-top:10px;gap:16px}
.stats div{display:grid;gap:2px}
.stats b{font-family:var(--display);font-size:clamp(26px,3vw,38px);font-weight:500;line-height:1}
.stats span{font-size:12.5px;color:rgba(255,255,255,.75);font-weight:600}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
/* villa cards */
.vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.vc{display:grid;grid-template-rows:auto 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;transition:transform .25s,box-shadow .25s}
.vc:hover{transform:translateY(-3px);box-shadow:0 18px 40px -18px var(--shade)}
.ph{position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;max-width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.vc:hover .ph img{transform:scale(1.035)}
.ph .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);color:#14171A;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px}
.ph.empty-ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface-2))}
.ph.empty-ph b{font-family:var(--display);font-size:120px;font-weight:500;color:var(--accent);opacity:.25;line-height:1}
.ph.empty-ph span{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
.vc .bd{padding:20px 22px 22px;display:grid;gap:10px;align-content:start}
.vc h3{font-size:34px}
.vc .meta{font-size:13px;color:var(--muted)}
.price-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.price-line b{font-family:var(--display);font-size:30px;font-weight:600}
.price-line small{display:block;font-size:12px;color:var(--muted);font-weight:600}
/* package strip on home */
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;text-align:left}
.pcard:hover{border-color:var(--muted)}
.pcard .nm{display:flex;gap:9px;align-items:center;font-weight:800;font-size:15px}
.pcard b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
.pcard small{font-size:12px;color:var(--muted);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
/* villa page */
.crumbs{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.crumb button{background:none;border:0;padding:0;color:var(--muted);font-weight:700}
.crumb button:hover{color:var(--fg)}
.vgrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:24px;align-items:start}
@media (max-width:980px){.vgrid{grid-template-columns:minmax(0,1fr)}}
.gal{display:grid;gap:10px;min-width:0;grid-template-columns:minmax(0,1fr)}
.gmain{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-2);aspect-ratio:16/10;max-width:100%}
.gmain img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.gmain img.fade{opacity:0}
.gmain .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 20px 16px;background:linear-gradient(transparent,rgba(8,10,9,.7));color:#fff;display:flex;justify-content:space-between;align-items:end;gap:12px}
.gmain .cap b{font-weight:700;font-size:15px;display:block}
.gmain .cap small{color:rgba(255,255,255,.8);font-size:12.5px;font-weight:600}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#14171A;font-size:20px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.gnav.l{left:14px}.gnav.r{right:14px}
.gtop{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.gtop button{border:0;background:rgba(255,255,255,.9);color:#14171A;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800}
.gthumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.gthumbs button{flex:none;width:96px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;padding:0;border:2px solid transparent;background:var(--surface-2);opacity:.7}
.gthumbs button[aria-current="true"]{border-color:var(--accent);opacity:1}
.gthumbs button:hover{opacity:1}
.gthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.gempty{aspect-ratio:16/10;border-radius:var(--r);background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));display:grid;place-items:center;text-align:center;padding:24px;max-width:100%}
.gempty div{display:grid;gap:10px;justify-items:center;max-width:42ch}
.gempty b{font-family:var(--display);font-size:30px;font-weight:600}
.buy{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:18px;box-shadow:0 20px 50px -30px var(--shade)}
@media (max-width:980px){.buy{position:static}}
.buy h1{font-size:clamp(44px,5vw,60px)}
.buy .meta{font-size:13px;color:var(--muted);margin-top:4px}
.pklist{display:grid;gap:6px}
.pkrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.pkrow:hover{border-color:var(--muted)}
.pkrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pkrow .n{font-weight:800;font-size:14.5px;display:flex;gap:8px;align-items:center}
.pkrow .n small{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--good);background:var(--good-bg);padding:2px 7px;border-radius:999px}
.pkrow .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.pkrow .p small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.total{display:grid;gap:4px;padding-top:16px;border-top:1px solid var(--line)}
.total b{font-family:var(--display);font-size:48px;font-weight:600;line-height:1}
.total .sub{font-size:13px;color:var(--muted)}
.buy .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* floors + rooms */
.ftabs{display:flex;gap:6px;flex-wrap:wrap}
.ftabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ftabs button span{font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.ftabs button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.rc{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;transition:transform .25s,box-shadow .25s}
.rc:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px var(--shade)}
.rc .ph{aspect-ratio:3/2}
.rc .ph.empty-ph b{font-size:56px}
.rc .bd{padding:14px 16px 16px;display:grid;gap:4px}
.rc .t{font-weight:800;font-size:15px}
.rc .s{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.rc .s b{color:var(--fg);font-variant-numeric:tabular-nums}
.b360{position:absolute;right:12px;top:12px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
.rlist{display:grid;gap:10px}
.rrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.rrow{display:grid;grid-template-columns:1fr auto auto 14px;gap:12px;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.rrow:hover{border-color:var(--muted)}
.rrow .t{font-weight:800;font-size:14px}
.rrow .s{font-size:12.5px;color:var(--muted)}
.rrow b{font-variant-numeric:tabular-nums;font-size:14px}
.rrow .go{color:var(--muted);font-size:18px;line-height:1}
.tbtn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.tbtn:hover{border-color:var(--accent);box-shadow:0 10px 24px -16px var(--shade)}
.tile .l em{font-style:normal;margin-left:auto;color:var(--accent);font-weight:800}
small.ib{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.brands{display:grid;gap:8px}
.brow{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.brow>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(80px,1fr) auto;gap:16px;align-items:center;padding:13px 16px}
.brow>summary::-webkit-details-marker{display:none}
.brow[open]>summary{border-bottom:1px solid var(--line)}
.brow .bn{display:grid;gap:4px;min-width:0}
.brow .bn b{font-size:15px}
.bbar{height:8px;background:var(--surface-2);border-radius:999px;position:relative;overflow:hidden}
.bbar i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.brow .bv{text-align:right;display:grid;font-variant-numeric:tabular-nums}
.brow .bv small{font-size:12px;color:var(--muted)}
@media (max-width:560px){.brow>summary{grid-template-columns:1fr auto}.bbar{grid-column:1/-1;grid-row:2}}
.insight{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5}
.insight b{color:var(--accent)}
.cmpl{display:grid;gap:6px}
.cmpr{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font-size:13.5px}
.cmpr[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cmpr .nm{display:flex;gap:8px;align-items:center;font-weight:800}
.cmpr b{font-variant-numeric:tabular-nums}
.comp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.clegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.clegend span,.clegend .cseg{display:flex;gap:6px;align-items:center}
.cseg{font:inherit;color:inherit;background:none;border:1px solid transparent;border-radius:999px;padding:4px 10px 4px 8px;margin:-4px -2px;cursor:pointer;transition:opacity .15s,border-color .15s}
.cseg:hover{border-color:var(--line,#ddd)}.cseg.off{opacity:.42;text-decoration:line-through}.cseg.off i{background:transparent!important;box-shadow:inset 0 0 0 1.5px currentColor}
.cbar i[data-segk]{cursor:pointer;transition:filter .15s}.cbar i[data-segk]:hover,.cbar i[data-segk]:focus-visible{filter:brightness(1.12);outline:2px solid var(--fg);outline-offset:1px}
.items td.fcol{text-align:left;white-space:nowrap;width:1%}.fcell{display:inline-flex;align-items:center;gap:8px;text-decoration:none}.fcell img{height:22px;max-width:96px;object-fit:contain;display:block}.fc-name{font-size:13px;font-weight:600;color:var(--fg)}
.segsheet .ithumb{width:168px;height:126px;padding:4px;overflow:hidden}.segsheet .ithumb img{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain}
.segsheet .ithumbs .ithumb,.segsheet .ithumbs .ithumb.im{width:110px;height:126px}.segsheet .icell{gap:16px;align-items:center}
@media (max-width:640px){.segsheet .ithumb{width:112px;height:84px}.segsheet .ithumbs .ithumb,.segsheet .ithumbs .ithumb.im{width:72px;height:84px}}
.segsheet .cur-s{font-size:11px;color:var(--muted);font-weight:600}
.sheet.segsheet{width:min(1180px,100%)}.segsheet .items td.wrap{min-width:280px}.segx .btn{padding:6px 10px}
.pboq-w{display:inline-flex;gap:6px;align-items:center;margin-left:10px}.pboq{font:600 11.5px/1 var(--sans,inherit);background:none;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--muted);cursor:pointer;opacity:0;transition:opacity .15s}
.crow:hover .pboq,.pboq:focus-visible,.crow .ped~.pboq{opacity:1}.pboq:hover{color:var(--fg);border-color:var(--fg)}.ped{font-style:normal;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 7px;border-radius:999px}.pboq-r{background:none;border:0;cursor:pointer;color:var(--muted);font-size:14px;padding:2px 4px}
@media (hover:none){.pboq{opacity:1}}
.seg-act{display:flex;gap:8px;align-items:center}
@media (max-width:640px){.segsheet .sheet-head{flex-wrap:wrap}.segsheet .sheet-head h2{font-size:30px}.seg-act{flex-wrap:wrap;width:100%;order:-1;justify-content:flex-end}.seg-act .xbtn{margin-left:auto}
 .crow .nm{flex-wrap:wrap;row-gap:4px}.pboq-w{margin-left:30px;flex-basis:100%}
 .deck-bar{gap:6px;padding:8px 10px;font-size:12px}.deck-bar .ov-btn{padding:6px 10px;white-space:nowrap;font-size:12px}.deck-bar [data-fs]{display:none}
 .sp-row{grid-template-columns:auto minmax(0,1fr) auto;gap:10px}.sp-row>.btn,.sp-row>.xbtn{grid-column:3;justify-self:end}.sp-row .ithumb{width:72px;height:56px}}.seg-act .btn:disabled{opacity:.4;cursor:default}

.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap}

.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px}

/* tables */

table{border-collapse:collapse;width:100%;font-size:13.5px}

.rooms{display:grid;gap:2px;max-height:420px;overflow:auto}

.plinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}.plink{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:inherit;min-width:0}.plink:hover{border-color:var(--muted)}.pl-ic{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:13px}.pl-b{display:grid;gap:2px;min-width:0;flex:1}.pl-b b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pl-b small{color:var(--muted);font-size:12.5px}.pl-go{font-weight:700;white-space:nowrap}

/* ---- v3: natural, editorial ---- */
body{font-size:15.5px;line-height:1.6}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:-.01em;line-height:1.1}
.eyebrow{font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}
.head{border-top:1px solid var(--fg);padding-top:14px}
.head h2{font-size:clamp(28px,3vw,38px)}
.head p{font-size:14.5px}
main{gap:88px;padding-top:36px}
.bar{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}
.logo i{border-radius:0;background:none;border:1px solid var(--fg);width:26px;height:26px}
.logo i::after{border-color:var(--fg);width:9px;height:9px;border-width:1px}
.logo b{font-family:var(--display);font-size:21px;font-weight:400;letter-spacing:0}
.logo small{font-weight:400}
.nav button{border-radius:0;padding:8px 2px;margin:0 10px;font-weight:500;color:var(--muted)}
.nav button[aria-current="true"]{background:none;color:var(--fg);box-shadow:inset 0 -1px 0 var(--fg)}
.seg{background:none;border:1px solid var(--line);border-radius:var(--r);padding:2px}
.seg button{border-radius:2px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--fg);color:#fff;box-shadow:none}
.btn{border-radius:var(--r);font-weight:500;box-shadow:none;padding:10px 18px}
.btn.primary{background:var(--fg);border-color:var(--fg);color:#fff;box-shadow:none}
.btn.primary:hover{background:#000;border-color:#000}
.link{color:var(--fg);font-weight:500;text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.num,.statrow b,.total b,.cbig b,.price-line b,.pcard b{font-variant-numeric:lining-nums tabular-nums}
/* hero */
.intro{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:end}
@media (max-width:820px){.intro{grid-template-columns:1fr;gap:16px}}
.intro h1{font-size:clamp(48px,7vw,96px);line-height:.95;letter-spacing:-.02em}
.intro p{color:var(--muted);font-size:17px;max-width:44ch}
.intro .hero-cta{margin-top:18px}
.cover{margin-top:28px;aspect-ratio:21/9;background:var(--surface-2);position:relative;overflow:hidden;max-width:100%}
@media (max-width:640px){.cover{aspect-ratio:4/3}}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.caption-line{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);padding-top:8px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:28px}
.facts div{padding:16px 0;display:grid;gap:0}
.facts div+div{padding-left:20px;border-left:1px solid var(--line)}
.facts b{font-family:var(--display);font-size:clamp(26px,3vw,36px);font-weight:400;font-variant-numeric:lining-nums}
.facts span{font-size:13px;color:var(--muted)}
@media (max-width:640px){.facts{grid-template-columns:1fr 1fr}.facts div:nth-child(3){padding-left:0;border-left:0}.facts div:nth-child(n+3){border-top:1px solid var(--line)}}
/* villa list */
.vcards{gap:36px 28px}
.vc{border:0;border-radius:0;background:none;transition:none}
.vc:hover{transform:none;box-shadow:none}
.vc .ph{aspect-ratio:4/3}
.vc:hover .ph img{transform:scale(1.02)}
.vc .bd{padding:14px 0 0;gap:6px}
.vc h3{font-size:30px}
.price-line{border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.price-line b{font-family:var(--display);font-size:26px;font-weight:400}
.ph .tag{border-radius:0;background:#fff;font-weight:500;font-size:12px;padding:3px 8px}
.ph.empty-ph{background:var(--surface-2)}
.ph.empty-ph b{display:none}
.ph.empty-ph span{position:static;font-size:13px;color:var(--muted);font-weight:400}
/* packages list on home */
.pstrip{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--line)}
.pcard{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:14px 16px 14px 0;background:none}
.pcard+.pcard{padding-left:16px;border-left:1px solid var(--line)}
.pcard .nm{font-weight:500}
.pcard b{font-family:var(--display);font-size:26px;font-weight:400}
.pcard small{font-weight:400}
.dot{display:none}
.band{background:none;border:0;border-top:1px solid var(--fg);border-radius:0;padding:20px 0 0;color:var(--fg)}
.band h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3vw,38px)}
.band p{color:var(--muted)}
.band .btn.light{background:var(--fg);color:#fff;border-color:var(--fg)}
/* villa page */
.crumb button{font-weight:400}
.gmain{border-radius:0}
.gnav{border-radius:0;box-shadow:none;background:#fff;width:40px;height:40px}
.gtop button{border-radius:0;font-weight:500}
.gthumbs button{border-radius:0;border-width:0 0 2px;opacity:.65}
.gthumbs button[aria-current="true"]{border-color:var(--fg)}
.gempty{border-radius:0;background:var(--surface-2)}
.gempty b{font-family:var(--display);font-weight:400}
.buy{border-radius:0;box-shadow:none;border:0;border-top:1px solid var(--fg);padding:16px 0 0;background:none}
.buy h1{font-size:clamp(40px,4.4vw,56px)}
.pklist{gap:0;border-top:1px solid var(--line)}
.pkrow{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 2px;background:none}
.pkrow:hover{background:var(--surface-2)}
.pkrow[aria-pressed="true"]{background:none;box-shadow:inset 3px 0 0 var(--fg);padding-left:12px}
.pkrow[aria-pressed="true"] .n{font-weight:600}
.pkrow .n{font-weight:500}
.pkrow .n small{background:none;padding:0;color:var(--good);font-weight:500;letter-spacing:0;font-size:12px;text-transform:lowercase}
.pkrow .p{font-weight:500}
.total{border-top:0;padding-top:4px}
.total b{font-family:var(--display);font-size:46px;font-weight:400}
.buy .actions .btn{width:100%}
.ftabs button{border-radius:0;border:0;border-bottom:1px solid transparent;padding:6px 0;margin-right:18px;background:none;font-weight:500}
.ftabs button[aria-pressed="true"]{background:none;color:var(--fg);border-color:var(--fg)}
.rgrid{gap:28px 20px}
.rc{border:0;border-radius:0;background:none;transition:none}
.rc:hover{transform:none;box-shadow:none}
.rc .bd{padding:10px 0 0}
.rc .t{font-weight:500}
.b360{border-radius:0;background:#fff;color:var(--fg);font-weight:600}
.rrows{gap:0;border-top:1px solid var(--line)}
.rrow{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 2px;background:none}
.rrow:hover{background:var(--surface-2)}
.rrow .t{font-weight:500}
.plan{border:0;border-radius:0;padding:0}
.plan-stage{border-radius:0}
.pin{border-radius:2px;box-shadow:none;background:var(--fg);color:#fff;font-weight:500}
.cbig b{font-family:var(--display);font-weight:400;font-size:clamp(52px,6vw,76px)}
.tiles{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile{border:0;border-radius:0;padding:14px 16px;background:none}
.tile+.tile{border-left:1px solid var(--line)}
.tile .l{font-weight:400}
.tile b{font-weight:500}
.tbtn:hover{background:var(--surface-2);box-shadow:none}
.tile .l em{color:var(--fg);font-weight:500;text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.tile+.tile{border-left:0;border-top:1px solid var(--line)}}
.stack{border-radius:0;height:8px}
.insight{background:none;border:0;border-left:2px solid var(--fg);border-radius:0;padding:4px 0 4px 14px;color:var(--muted)}
.insight b{color:var(--fg);font-weight:500}
.more{border:0;border-top:1px solid var(--line);border-radius:0;background:none}
.more>summary{padding:14px 0;font-weight:500}
.more .in{padding:0 0 18px}
.lg.tot{font-weight:600}
.delta{background:none;padding:0;font-weight:500}
.delta.ok{background:none}
.others{gap:24px 20px}
.oc{border:0;border-radius:0;background:none}
.oc .bd{padding:10px 0 0}
.oc .nm{font-weight:500}
.oc .pr b{font-weight:500}
.oc .ph.empty-ph{background:var(--surface-2)!important}
.oc .ph.empty-ph b{display:block;font-family:var(--display);font-weight:400;font-size:28px!important;opacity:.5;color:var(--fg)}
.tbl-wrap{border-radius:0;border-left:0;border-right:0}
thead th{background:none;border-bottom:1px solid var(--fg);font-weight:500;letter-spacing:.02em}
tr.grp td{background:var(--surface-2);font-weight:500}
.typetag{border-radius:0;border:0;padding:0;font-weight:400}
td.best{font-weight:600}
/* sheets & compare */
.sheet-wrap{background:rgba(28,28,26,.25);backdrop-filter:none}
.sheet{background:#fff;box-shadow:-1px 0 0 var(--line)}
.xbtn{border-radius:0}
.cmpr,.brow{border-radius:0}
.cmpr[aria-pressed="true"]{background:var(--surface-2);border-color:var(--fg)}
.rank{border:0;border-radius:0;padding:0;background:none;border-top:1px solid var(--line)}
.rank-row{border-radius:0;border-bottom:1px solid var(--line);padding:12px 0}
.rank-row .pos{font-family:var(--display);font-weight:400}
.track,.fill,.bbar,.bbar i,.tb .t,.tb .t i{border-radius:0}
.comp{border:0;border-radius:0;padding:0;background:none}
.cbar{border-radius:0}
.ph,.h-img{border-radius:0}
.toast{border-radius:var(--r)}
@media (max-width:700px){.bar-in{gap:10px;padding-block:10px}.logo small{display:none}.bar-actions{margin-left:auto}
 .nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none}.nav button{flex:none}}
.autot{display:flex;gap:6px}.autot input{flex:1}.autot input[readonly]{background:var(--surface-2);color:var(--muted);cursor:pointer}
.cmp-scope{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:5;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line);margin-bottom:-56px}
@media (max-width:760px){.cmp-scope{position:static;margin-bottom:-48px}.cmp-scope .seg{overflow-x:auto;max-width:100%}}
.cmp-scope .seg button{font-size:13px;padding:7px 14px}
.cellbtn{cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.cellbtn:hover{text-decoration-color:currentColor}
th.muted,td.muted{color:var(--muted)}
.hshow{margin-top:28px;border-radius:0;aspect-ratio:21/9;background:var(--surface-2);position:relative;overflow:hidden;max-width:100%;cursor:pointer;outline:none}
.hshow:focus-visible{box-shadow:0 0 0 2px var(--fg)}
.hs{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1s ease;pointer-events:none}
.hs.on{opacity:1;pointer-events:auto}
.hs img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04);transition:transform 7s ease-out}
.hs.on img{transform:scale(1)}
.hs figcaption{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:22px 26px 30px;color:#fff;
  background:linear-gradient(180deg,rgba(0,0,0,.28) 0,rgba(0,0,0,0) 26%,rgba(0,0,0,0) 48%,rgba(0,0,0,.62) 100%)}
.hv{align-self:flex-start;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;border:1px solid rgba(255,255,255,.7);padding:6px 10px}
.hb{display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.hl{display:grid;gap:8px;min-width:0}
.hroom{font-family:var(--display);font-weight:400;font-size:clamp(28px,4vw,52px);line-height:1}
.hp{display:inline-flex;gap:8px;align-items:center;font-size:14px;font-weight:500}
.hpr{display:grid;gap:3px;text-align:right;white-space:nowrap}
.hpr small{font-size:11.5px;opacity:.85}
.hpr b{font-family:var(--display);font-weight:400;font-size:clamp(24px,3vw,40px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
.hpr b span{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:.38em;letter-spacing:.06em}
.hnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border:0;background:rgba(255,255,255,.85);color:#111;font-size:24px;line-height:1;opacity:0;transition:opacity .2s;z-index:2}
.hshow:hover .hnav,.hshow:focus-within .hnav{opacity:1}
.hnav.l{left:14px}.hnav.r{right:14px}
.hdots{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.hdots button{width:6px;height:6px;border-radius:50%;border:0;padding:0;background:rgba(255,255,255,.5)}
.hdots button[aria-current="true"]{background:#fff}
.hbar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.18);z-index:2}
.hbar i{display:block;height:100%;background:#fff;transform-origin:left;animation:hbar var(--hms,6000ms) linear forwards}
.hshow.paused .hbar i{animation-play-state:paused}.hshow.still .hbar{display:none}
@keyframes hbar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (max-width:640px){.hshow{aspect-ratio:4/5}.hs figcaption{padding:16px 16px 26px}.hb{flex-direction:column;align-items:flex-start;gap:14px}.hpr{text-align:left}.hnav,.hdots{display:none}}
@media (prefers-reduced-motion:reduce){.hs,.hs img{transition:none}}
.fmtseg{display:inline-flex;border:1px solid #2A302E;border-radius:10px;padding:3px;gap:3px;justify-self:start}
.fmtseg button{background:none;border:0;color:#B9C0BC;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13.5px}
.fmtseg button[aria-pressed="true"]{background:#EEECE6;color:#151A18}
.deck-logos{position:absolute;top:14px;right:18px;z-index:5;display:flex;gap:14px;align-items:center;pointer-events:none}
.deck-logos .dl-e{background:#fff;padding:5px 9px;border-radius:6px;display:flex}.deck-logos .dl-e img{height:30px;width:auto}
.deck-logos .dl-r{height:24px;width:auto}
.pdfbox{background:#151A18;border:1px solid #27302C;border-radius:16px;padding:28px;display:grid;gap:16px;max-width:460px;width:100%;color:#EEECE6}
.pdfbox .prog{height:4px;background:#27302C;border-radius:2px;overflow:hidden}.pdfbox .prog i{display:block;height:100%;width:0;background:#7CC0AE;transition:width .2s}
.pdfbox .muted{color:#9AA29E;font-size:13px}
.slide.cover{position:absolute;inset:0;aspect-ratio:auto;margin:0;max-width:none}
.ov #dGo{background:#EEECE6;color:#151A18;border-color:#EEECE6}
.mfilter{display:grid;gap:10px;padding:14px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);background:var(--bg);z-index:4}
.mrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mlab{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);width:56px;flex:none}
.mchip{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:5px 10px;font-size:13px;font-weight:500;border-radius:999px;cursor:pointer}
.mchip span{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mchip[aria-pressed="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}.mchip[aria-pressed="true"] span{color:rgba(255,255,255,.75)}
.mchip .dot{width:8px;height:8px}
#mfQ{margin-left:auto;min-width:220px;border:1px solid var(--line);padding:6px 10px;font:inherit;font-size:13px;background:var(--surface);color:var(--fg)}
.mdup{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.mitem[hidden]{display:none!important}
@media (max-width:760px){.mfilter{position:static}.mrow{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px}.mlab{width:auto}#mfQ{margin-left:0;min-width:180px}}
.mchip.zero{opacity:.45}
.drvcard{display:grid;gap:14px;margin:0 0 18px}
.drvhead b{display:block;font-size:16px;margin-bottom:4px}.drvhead .muted{font-size:13px}.drvhead code{font-size:12px;background:var(--surface-2);padding:1px 5px}
.drvform{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}.drvform .f{flex:1;min-width:260px}
.drvbar{height:3px;background:var(--surface-2);overflow:hidden;margin:8px 0}.drvbar i{display:block;height:100%;width:0;background:var(--fg);transition:width .2s}
.drvlog{max-height:220px;overflow:auto;display:grid;gap:2px;font-size:12.5px}
.drvrow{padding:3px 0;border-bottom:1px solid var(--line);color:var(--muted)}.drvrow.ok{color:var(--good)}.drvrow.bad{color:#B4472F}
.mitem.deleting{opacity:.4;pointer-events:none}
.gmain .capr{display:grid;justify-items:end;gap:2px}
.gmain .capr b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.dsg{display:grid;grid-template-columns:minmax(150px,1fr) minmax(220px,1.4fr) auto;gap:22px;align-items:start;border:1px solid var(--line);background:var(--surface);padding:16px 18px;margin-top:10px}
.dsg .dl{display:grid;gap:4px}.dsg .dl b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05}
.dsg .dl .muted{font-size:12.5px;display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
.dits{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13.5px}
.dits li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:5px}
.dits li span{display:grid}.dits li small{font-size:11.5px;color:var(--muted)}.dits li.more{color:var(--muted);border:0;font-size:12.5px}
.dsg .dr{display:grid;gap:6px;justify-items:end;text-align:right}
.dsg .dr b{font-family:var(--display);font-weight:400;font-size:34px;line-height:1;font-variant-numeric:lining-nums tabular-nums}
.dsg .dr b span{font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:13px;margin-left:6px;letter-spacing:.05em;color:var(--muted)}
.dsg.empty{grid-template-columns:1fr auto}
@media (max-width:760px){.dsg{grid-template-columns:1fr;gap:14px}.dsg .dr{justify-items:start;text-align:left}}
@media (max-width:640px){.gmain .capr b{font-size:19px;white-space:nowrap}.gmain .cap b#gTitle{font-size:13.5px}}
.slide .imgbg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(36px) brightness(.42) saturate(1.1);z-index:0}
.slide .full-img{object-fit:contain;z-index:0}
.slide.cover>.imgbg,.slide.cover>.full-img{position:absolute}
.slide.cover::before{z-index:1}
.slide.cover>*:not(.imgbg):not(.full-img){z-index:2}
.slide .caption{z-index:2}
.hdr-logos{display:flex;align-items:center;gap:14px;padding-left:18px;margin-left:2px;border-left:1px solid var(--line);height:36px}
.hdr-logos .lg-e{height:34px;width:auto}.hdr-logos .lg-r{height:22px;width:auto}
.lg-sep{width:1px;height:24px;background:var(--line)}
@media (max-width:1180px){.hdr-logos{gap:10px;padding-left:12px}.hdr-logos .lg-e{height:28px}.hdr-logos .lg-r{height:17px}}
@media (max-width:900px) and (min-width:701px){#psub{display:none}.bar-in{gap:12px}.hdr-logos{gap:8px;padding-left:10px}.hdr-logos .lg-e{height:24px}.hdr-logos .lg-r{height:14px}.nav button{margin:0 6px}}
@media (max-width:400px){.hdr-logos .lg-e{height:20px}.hdr-logos .lg-r{height:12px}.nav button{margin:0 6px}}
@media (max-width:700px){.hdr-logos{order:4;border-left:0;padding-left:0;margin-left:auto;height:auto;gap:8px;flex:none}.hdr-logos .lg-e{height:24px}.hdr-logos .lg-r{height:14px}.hdr-logos .lg-sep{height:16px}
 .bar-in .nav{width:auto;flex:1 1 auto;min-width:0}}
.site-foot{border-top:1px solid var(--line);margin-top:72px;padding:28px 0 calc(28px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.site-foot:empty{display:none}
.foot-in{display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap}
.foot-logos{display:flex;align-items:center;gap:22px}.foot-logos .lg-e{height:56px;width:auto}.foot-logos .lg-r{height:34px;width:auto}.foot-logos .lg-sep{height:40px}
.site-foot p{margin:0;font-size:13px;color:var(--fg);text-align:right;line-height:1.6}.site-foot p span{color:var(--muted)}
@media (max-width:640px){.site-foot p{text-align:left}.foot-logos .lg-e{height:46px}.foot-logos .lg-r{height:28px}}
.lockbtn{display:inline-flex;gap:6px;align-items:center}
.lockov .ov-body{align-items:center}
.lockbox{background:var(--bg);color:var(--fg);border:1px solid var(--line);padding:26px;display:grid;gap:12px;width:min(380px,100%)}

/* ---- landing (real-estate) ---- */
html,body{overflow-x:clip}
.bleed{width:100vw;margin-left:calc(50% - 50vw);margin-right:calc(50% - 50vw)}
main:has(> .lph){padding-top:0}
.lph{position:relative;min-height:min(88svh,860px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#1a1714;color:#fff;isolation:isolate}
.lph-s{position:absolute;inset:0;margin:0;opacity:0;transition:opacity 1.4s ease;z-index:-2}
.lph-s.on{opacity:1}
.lph-s img{width:100%;height:100%;object-fit:cover;transform:scale(1.06);transition:transform 7.5s linear}
.lph-s.on img{transform:scale(1)}
.lph-s figcaption{position:absolute;right:clamp(16px,4vw,48px);top:clamp(18px,3vw,32px);font-size:12.5px;color:rgba(255,255,255,.85);background:rgba(0,0,0,.28);backdrop-filter:blur(6px);padding:5px 10px;border-radius:999px}
.lph::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(12,10,8,.15) 0%,rgba(12,10,8,.05) 35%,rgba(12,10,8,.55) 70%,rgba(12,10,8,.82) 100%)}
.lph-in{width:100%;padding:0 clamp(16px,4vw,32px) clamp(28px,4vw,44px);box-sizing:border-box;display:grid;gap:14px;justify-items:start}
.lph-eb{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.lph h1{font-size:clamp(52px,9vw,128px);line-height:.92;margin:0;color:#fff;letter-spacing:-.02em}
.lph-in p{max-width:560px;font-size:clamp(15px,1.4vw,18px);color:rgba(255,255,255,.88);margin:0}
.lph-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.lph-cta .btn{border-radius:999px;padding:13px 22px;font-weight:600}
.lph-p{background:#fff;color:#14171A;border-color:#fff}
.lph-g{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(8px)}
.lph-g:hover{background:rgba(255,255,255,.2)}
.lph-3d{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#E8A33D;color:#1b1407;font-size:9.5px;font-weight:800;margin-right:8px;vertical-align:middle}
.lph-3d.d{width:22px;height:22px}
.lph-dots{position:absolute;right:clamp(16px,4vw,48px);bottom:calc(clamp(88px,9vw,104px) + 20px);display:flex;gap:6px}
.lph-dots button{width:30px;height:16px;border:0;background:none;padding:0;display:grid;align-items:center}
.lph-dots i{display:block;height:2px;background:rgba(255,255,255,.45)}
.lph-dots button[aria-current="true"] i{background:#fff}
.lph-facts{border-top:1px solid rgba(255,255,255,.18);background:rgba(12,10,8,.35);backdrop-filter:blur(10px)}
.lph-facts .wrap{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;padding:0 clamp(16px,4vw,32px);box-sizing:border-box}
.lph-facts .wrap>div{padding:18px 18px 20px 0;display:grid;gap:2px}
.lph-facts .wrap>div+div{padding-left:18px;border-left:1px solid rgba(255,255,255,.14)}
.lph-facts b{font-family:var(--display);font-weight:400;font-size:clamp(26px,2.6vw,36px);line-height:1}
.lph-facts small{font-family:var(--body);font-size:13px;color:rgba(255,255,255,.75)}
.lph-facts span{font-size:12.5px;color:rgba(255,255,255,.72)}
.lph-facts .hl b{color:#F2D29B}
.lpi{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(24px,6vw,96px);align-items:start}
.lpi h2{font-size:clamp(32px,4vw,54px);margin:8px 0 0}
.lpi-r p{font-size:16.5px;margin:0 0 22px;color:var(--fg)}
.lpi dl{margin:0;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.lpi dl>div{padding:14px 0;border-bottom:1px solid var(--line)}
.lpi dl>div:nth-child(odd){padding-right:16px}
.lpi dt{font-size:12.5px;color:var(--muted)}
.lpi dd{margin:2px 0 0;font-weight:500}
.lpv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:28px}
.lpv-c{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden;transition:box-shadow .3s,transform .3s}
.lpv-c:hover{box-shadow:0 18px 40px rgba(30,25,15,.12);transform:translateY(-3px)}
.lpv-ph{position:relative;display:block;aspect-ratio:4/4.3;border:0;padding:0;overflow:hidden;background:var(--surface-2);cursor:pointer}
.lpv-ph img{width:100%;height:100%;object-fit:cover;transition:transform .8s ease}
.lpv-c:hover .lpv-ph img{transform:scale(1.045)}
.lpv-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.6))}
.lpv-tags{position:absolute;left:14px;top:14px;z-index:1;display:flex;gap:6px;flex-wrap:wrap}
.lpv-tags span{background:rgba(255,255,255,.92);color:#1c1c1a;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px}
.lpv-tags .k{background:#E8A33D;color:#1b1407}
.lpv-nm{position:absolute;left:18px;bottom:14px;z-index:1;color:#fff;font-family:var(--display);font-size:clamp(34px,3.4vw,46px);line-height:1;text-align:left}
.lpv-nm small{display:block;font-family:var(--body);font-size:12.5px;opacity:.85;margin-bottom:4px}
.lpv-bd{padding:16px 18px 18px;display:grid;gap:12px}
.lpv-pr{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.lpv-pr small{display:block;font-size:12.5px;color:var(--muted)}
.lpv-pr b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.1}
.lpv-pr .r{text-align:right}.lpv-pr .r span{font-size:13px;color:var(--muted)}
.lpv-a{display:flex;gap:8px}.lpv-a .btn{flex:1;justify-content:center}
.mkf{background:#14171A;color:#fff;padding:clamp(40px,6vw,80px) 0;position:relative;overflow:hidden}
.mkf::before{content:"";position:absolute;inset:auto -10% -40% 40%;height:120%;background:radial-gradient(closest-side,rgba(232,163,61,.18),transparent);pointer-events:none}
.mkf-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.25fr);gap:clamp(24px,5vw,64px);align-items:center;padding:0 clamp(16px,4vw,32px);box-sizing:border-box;position:relative}
.mkf-badge{display:inline-block;background:#E8A33D;color:#1b1407;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;letter-spacing:.02em}
.mkf h2{font-size:clamp(34px,4.2vw,58px);color:#fff;margin:14px 0 10px}
.mkf-t>p{color:rgba(255,255,255,.75);font-size:16px;margin:0 0 22px;max-width:480px}
.mkf ul{list-style:none;margin:0 0 26px;padding:0;display:grid;gap:14px}
.mkf li{display:flex;gap:12px;align-items:flex-start}
.mkf-ic{flex:none;width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center;font-size:14px;color:#F2D29B}
.mkf li b{display:block;font-weight:600}.mkf li small{color:rgba(255,255,255,.62);font-size:13.5px}
.mkf-cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mkf-go{background:#E8A33D;color:#1b1407;border-color:#E8A33D;border-radius:999px;padding:13px 22px;font-weight:700}
.mkf-go span{margin-left:6px}
.mkf-soon{font-size:13px;color:rgba(255,255,255,.55)}
.mkf-img{position:relative;border:0;padding:0;border-radius:10px;overflow:hidden;cursor:pointer;background:#e9e4db;box-shadow:0 30px 60px rgba(0,0,0,.4);aspect-ratio:16/10}
.mkf-img img{width:100%;height:100%;object-fit:cover;transition:transform 1s ease}
.mkf-img:hover img{transform:scale(1.04)}
.mkf-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;background:rgba(20,23,26,.82);color:#fff;padding:10px 18px 10px 10px;border-radius:999px;font-weight:600;backdrop-filter:blur(6px)}
.mkf-play i{font-style:normal;width:40px;height:40px;border-radius:50%;background:#E8A33D;color:#1b1407;display:grid;place-items:center;font-size:12px;font-weight:800;animation:mkfP 2.2s ease-out infinite}
@keyframes mkfP{0%{box-shadow:0 0 0 0 rgba(232,163,61,.6)}100%{box-shadow:0 0 0 16px rgba(232,163,61,0)}}
.mkf-v{padding:clamp(32px,4.5vw,56px) 0}.mkf-v h2{font-size:clamp(30px,3.4vw,46px)}.mkf-v ul{grid-template-columns:1fr 1fr;gap:12px 18px}
@media (max-width:900px){.lph-facts .wrap{grid-template-columns:1fr 1fr}.lph-facts .wrap>div{padding:12px 12px 12px 0}.lph-facts .wrap>div+div{padding-left:0;border-left:0}.lph-facts .wrap>div:nth-child(even){padding-left:14px;border-left:1px solid rgba(255,255,255,.14)}.lph-facts .hl{grid-column:1/-1;border-left:0!important;padding-left:0!important;border-top:1px solid rgba(255,255,255,.14)}
 .lph-dots{display:none}.lph{min-height:auto;padding-top:46svh}.lpi{grid-template-columns:1fr}.mkf-in{grid-template-columns:1fr}.mkf-img{order:-1}.mkf-v ul{grid-template-columns:1fr}.lph-s figcaption{display:none}}
@media (max-width:560px){.lph-cta .btn{padding:11px 16px;font-size:14px}.lpi dl{grid-template-columns:1fr}.lpi dl>div:nth-child(odd){padding-right:0}}
.lph-facts .wrap>.hl{background:none;border-radius:0;text-align:left;box-shadow:none}.lph::before{background:linear-gradient(180deg,rgba(12,10,8,.18) 0%,rgba(12,10,8,.05) 30%,rgba(12,10,8,.6) 65%,rgba(12,10,8,.86) 100%)}

.inc{display:grid;gap:22px}
.inc-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,5vw,80px);align-items:end}
.inc-h h2{font-size:clamp(30px,3.6vw,48px);margin:6px 0 0}
.inc-h p{margin:0;color:var(--muted);font-size:15.5px;max-width:520px}
.inc-lg{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.inc-lg span{display:inline-flex;align-items:center;gap:7px}.inc-lg i{width:9px;height:9px;border-radius:50%;background:var(--c)}

function render(){
  renderTabs();navSync();const m=$("#main");
  if((S.view==="admin"||S.view==="sugar")&&!S.canEdit)S.view="villas";
  if(!S.cfg){
    if(S.view==="admin"){m.innerHTML=adminHTML();bindAdmin();return;}
    m.innerHTML=`<div class="empty" style="margin-top:40px"><strong>${S.dbReady?"Henüz veri yok":"Sunum yükleniyor"}</strong>
      <span>${S.dbReady?(S.canEdit?"Yönetim bölümünden Google Sheets verisini çekin.":"Proje verileri yüklendiğinde sunum burada görünecek."):"Villa verileri ve görseller birkaç saniye içinde gelecek."}</span>
      ${S.dbReady&&S.canEdit?`<button class="btn primary" data-go="admin">Yönetime git</button>`:""}</div>`;
    m.querySelector("[data-go]")?.addEventListener("click",()=>{S.admin="data";setView("admin")});return;}
  if(S.view!=="maket"&&MK){MK.destroy&&MK.destroy();MK=null;}
  if(S.view==="maket"){if(!villas().includes(S.villa)||!hasMaket(S.villa)){S.view=villas().includes(S.villa)?"villa":"villas";return render();}
    if(!pkgByName(S.pkg))S.pkg=rankedFor(S.villa)[0]?.name;
    if(MK&&MK.v===S.villa&&document.contains(MK.el)){mkUI();return;}
    if(MK){MK.destroy&&MK.destroy();MK=null;}m.innerHTML=maketHTML();initMaket();return;}
  if(S.view==="villa"){
    if(!villas().includes(S.villa)){S.view="villas";return render();}
    if(!pkgByName(S.pkg))S.pkg=rankedFor(S.villa)[0]?.name;
    if(!floorsOnly().includes(S.floor))S.floor=floorsOnly()[0];
    m.innerHTML=villaHTML();bindVilla();}
  else if(S.view==="compare"){m.innerHTML=compareHTML();bindCompare();}
  else if(S.view==="vcompare"){m.innerHTML=vcompareHTML();bindVcompare();}
  else if(S.view==="firms"){m.innerHTML=firmsHTML();bindFirm();}
  else if(S.view==="firm"){if(!firmByName(S.firm)){S.view="firms";return render();}m.innerHTML=firmHTML();bindFirm();}
  else if(S.view==="admin"){m.innerHTML=adminHTML();bindAdmin();}
  else if(S.view==="sugar"){m.innerHTML=sugarHTML();bindSugar();}
  else {S.view="villas";m.innerHTML=listHTML();bindList();}
}

/* ---------- home: hero slideshow ---------- */
function heroPool(){const seen=new Set();const out=[];
  S.media.filter(m=>m.kind==="render"&&m.asset&&villas().includes(m.villa)).sort(byOrder).forEach(m=>{
    const k1=m.asset,k2=[m.villa,m.room,m.brand,m.fileName].join("|");if(seen.has(k1)||seen.has(k2))return;seen.add(k1);seen.add(k2);out.push(m);});
  return out;}
function heroList(){const pool=heroPool();const key=pool.map(m=>m.id).sort().join(",");
  const ckey=pool.filter(m=>m.cover).map(m=>m.id+":"+(m.coverAt||0)).join(",");
  if(!S.hero||S.hero.key!==key||S.hero.ckey!==ckey){const covers=pool.filter(m=>m.cover).sort(byCover);const a=pool.filter(m=>!m.cover);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}S.hero={key,ckey,list:[...covers,...a],i:0};}
  return S.hero.list;}
function heroInfo(m){const b=pkgByName(m.brand);const v=m.villa;const pk=b||rankedFor(v).find(x=>!hiddenFor(m,x.name))||rankedFor(v)[0];
  return {villa:v,room:m.room||m.title||"Oda",pkg:pk,price:pk?net(pk,v):0,exact:!!b};}
function heroSlide(m,i,on){const h=heroInfo(m);const load=on||i===((S.hero.i+1)%S.hero.list.length);
  return `<figure class="hs${on?" on":""}" data-hi="${i}" aria-hidden="${!on}"><img ${load?`src="${blob(m.asset)}"`:`data-src="${blob(m.asset)}"`} alt="${esc([h.villa,h.room,h.pkg?pl(h.pkg.name):""].filter(Boolean).join(" · "))}">
    <figcaption><span class="hv">${esc(h.villa)}</span>
     <div class="hb"><div class="hl"><b class="hroom">${esc(h.room)}</b><span class="hp">${h.pkg?dot(h.pkg.name):""}${esc(h.pkg?pl(h.pkg.name)+" paketi":"")}</span></div>
      <div class="hpr"><small>${h.exact?"Bu paketle villa fiyatı":"Başlangıç fiyatı"}</small><b class="num">${money(h.price)}&nbsp;<span>${S.cur}</span></b><small>KDV hariç · navlun, montaj dahil</small></div></div></figcaption></figure>`;}
function heroHTML(fallback){const list=heroList();
  if(!list.length)return fallback?`<div class="cover"><img src="${blob(fallback.asset)}" alt=""></div>`:"";
  const i=Math.min(S.hero.i,list.length-1);S.hero.i=i;
  return `<div class="hshow" id="hero" tabindex="0" aria-roledescription="slayt gösterisi" aria-label="Villa görselleri">${list.map((m,k)=>heroSlide(m,k,k===i)).join("")}
    ${list.length>1?`<button class="hnav l" data-hstep="-1" aria-label="Önceki">‹</button><button class="hnav r" data-hstep="1" aria-label="Sonraki">›</button>
    <div class="hdots">${list.map((_,k)=>`<button data-hgo="${k}" aria-label="${k+1}. görsel" aria-current="${k===i}"></button>`).join("")}</div><div class="hbar"><i></i></div>`:""}</div>`;}
function heroGo(n){const h=$("#hero");if(!h||!S.hero)return;const L=S.hero.list.length;const i=((n%L)+L)%L;S.hero.i=i;
  h.querySelectorAll(".hs").forEach(f=>{const on=+f.dataset.hi===i;f.classList.toggle("on",on);f.setAttribute("aria-hidden",!on);});
  [i,(i+1)%L].forEach(k=>{const im=h.querySelector(`.hs[data-hi="${k}"] img[data-src]`);if(im){im.src=im.dataset.src;im.removeAttribute("data-src");}});
  h.querySelectorAll("[data-hgo]").forEach(d=>d.setAttribute("aria-current",+d.dataset.hgo===i));
  const bar=h.querySelector(".hbar i");if(bar){bar.style.animation="none";void bar.offsetWidth;bar.style.animation="";}}
const HERO_MS=6000;
function bindHero(){clearInterval(S.heroTimer);const h=$("#hero");if(!h||!S.hero||S.hero.list.length<2)return;
  let paused=false;const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  h.style.setProperty("--hms",HERO_MS+"ms");
  const tick=()=>{if(!document.getElementById("hero")){clearInterval(S.heroTimer);return;}if(!paused&&!document.hidden)heroGo(S.hero.i+1);};
  if(!reduce)S.heroTimer=setInterval(tick,HERO_MS);else h.classList.add("still");
  const pause=v=>{paused=v;h.classList.toggle("paused",v);};
  h.addEventListener("mouseenter",()=>pause(true));h.addEventListener("mouseleave",()=>pause(false));
  h.addEventListener("focusin",()=>pause(true));h.addEventListener("focusout",()=>pause(false));
  const restart=()=>{clearInterval(S.heroTimer);if(!reduce)S.heroTimer=setInterval(tick,HERO_MS);};
  h.addEventListener("click",e=>{const st=e.target.closest("[data-hstep]"),go=e.target.closest("[data-hgo]");
    if(st){heroGo(S.hero.i+ +st.dataset.hstep);restart();return;}if(go){heroGo(+go.dataset.hgo);restart();return;}
    const m=S.hero.list[S.hero.i];if(m)openVilla(m.villa,pkgByName(m.brand)?m.brand:undefined);});
  h.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){heroGo(S.hero.i+1);restart();}else if(e.key==="ArrowLeft"){heroGo(S.hero.i-1);restart();}else if(e.key==="Enter"){const m=S.hero.list[S.hero.i];if(m)openVilla(m.villa,pkgByName(m.brand)?m.brand:undefined);}});
  let x0=null;h.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true});
  h.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>40){heroGo(S.hero.i+(dx<0?1:-1));restart();}});}

function bindLpHero(){clearInterval(S.lpTimer);const h=$("#lphero");if(!h)return;const fs=[...h.querySelectorAll(".lph-s")];if(fs.length<2)return;let i=0;
  const go=n=>{i=(n+fs.length)%fs.length;fs.forEach((f,k)=>f.classList.toggle("on",k===i));[i,(i+1)%fs.length].forEach(k=>{const im=fs[k].querySelector("img[data-src]");if(im){im.src=im.dataset.src;im.removeAttribute("data-src");}});
    h.querySelectorAll("[data-lgo]").forEach(d=>d.setAttribute("aria-current",+d.dataset.lgo===i));};
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;const start=()=>{clearInterval(S.lpTimer);if(!reduce)S.lpTimer=setInterval(()=>{if(!document.getElementById("lphero")){clearInterval(S.lpTimer);return;}if(!document.hidden)go(i+1);},6500);};

function compSplit(pkg,vs,k){const tech=k.startsWith("x_");const kk=tech?k.slice(2):k;const arr=[];vs.forEach(v=>boqItems(pkg,v).forEach(it=>{if(!!isTech(it.f)!==tech)return;const t=isExtra(it.f)?"Ev Dekorasyon":it.t==="Fixed"?"Fixed:"+FIXED_SUB(it):(it.t||"");const tk=["Loose Furniture","Ev Dekorasyon","Electrical Appliance","Installation","Smart Home"].includes(t)||t.startsWith("Fixed:")?t:"_other";if(tk===kk)arr.push(it);}));return brandSplit(arr);}

function firmCell(it){const f=firmOfItem(it);const nm=f?f.name:brandLabel(it.b);if(!f)return `<span class="fc-name">${esc(nm)}</span>`;
  const ls=(f.d?.logos&&f.d.logos.length?f.d.logos:f.d?.logo?[f.d.logo]:[]);const showName=!ls.length||f.d.logoMark;
  return `<span class="flink fcell" role="link" tabindex="0" data-firm="${esc(f.name)}" title="${esc(nm)}">${ls.map(l=>`<img src="${esc(blob(l))}" alt="${esc(nm)}" loading="lazy">`).join("")}${showName?`<span class="fc-name">${esc(nm)}</span>`:""}</span>`;}
/* segment popup: renders of this villa + package on top, editable item list (add / remove, only in this window and its PDF) */

const igCode=u=>{const m=String(u||"").match(/instagram\.com\/(?:[^\/]+\/)?(p|reel|tv)\/([A-Za-z0-9_-]+)/);return m?{t:m[1],c:m[2]}:null;};

const vmId=u=>{const m=String(u||"").match(/vimeo\.com\/(?:video\/)?(\d+)/);return m?m[1]:null;};
function postCard(x){if(x.video){const u=safeUrl(x.url);const meta=esc([netLabel(x.network||"instagram"),fmtDate(x.date)].filter(Boolean).join(" · "));
    return `<div class="reel"><div class="rv"><video src="${esc(blob(x.video))}" ${x.img?`poster="${esc(blob(x.img))}"`:""} controls playsinline preload="none"></video></div><div class="bd"><span class="eyebrow">${meta}</span><b>${esc(clip(x.caption,90))}</b>${u?ext(u,"Instagram'da aç ↗"):""}</div></div>`;}
  const u=safeUrl(x.url);const ig=igCode(u);const meta=esc([netLabel(x.network||(ig?"instagram":"")),fmtDate(x.date)].filter(Boolean).join(" · "));
  if(ig&&!x.img)return `<div class="igbox"><iframe src="https://www.instagram.com/${ig.t==="reel"?"reel":"p"}/${ig.c}/embed/captioned/" loading="lazy" title="Instagram paylaşımı" allowtransparency="true" scrolling="no"></iframe><div class="bd"><span class="eyebrow">${meta}</span>${ext(u,"Instagram'da aç ↗")}</div></div>`;
  const img=x.img?blob(x.img):"";
  return `<a class="fpost" ${u?`href="${esc(u)}" target="_blank" rel="noopener"`:""}>${img?`<div class="ph"><img src="${esc(img)}" alt="" loading="lazy"></div>`:`<div class="ph empty-ph"><span>${esc(netLabel(x.network)||"Paylaşım")}</span></div>`}
   <div class="bd"><span class="eyebrow">${meta}</span><span>${esc(clip(x.caption,160))}</span></div></a>`;}
function videoCard(x){if(x.file){const src=safeUrl(x.source||x.url);const meta=esc([x.fair,x.year].filter(Boolean).join(" · "));
    return `<div class="vid"><div class="vf"><video src="${esc(blob(x.file))}" ${x.poster?`poster="${esc(blob(x.poster))}"`:""} controls playsinline preload="none" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111"></video></div><div class="bd">${meta?`<span class="eyebrow">${meta}</span>`:""}<b>${esc(x.title||"Video")}</b>${src?ext(src,"Kaynak: "+(ytId(src)?"YouTube":hostOf(src))+" ↗"):""}</div></div>`;}
  const u=safeUrl(x.url);const yt=ytId(u),vm=vmId(u),ig=igCode(u);const mp4=/\.(mp4|webm|mov)(\?|$)|\/videos\//i.test(u)&&!yt&&!vm&&!ig;
  const src=yt?`https://www.youtube-nocookie.com/embed/${yt}?autoplay=1&rel=0`:vm?`https://player.vimeo.com/video/${vm}?autoplay=1`:"";
  const th=yt?`https://i.ytimg.com/vi/${yt}/hqdefault.jpg`:"";

  const frame=mp4?`<div class="vf"><video src="${esc(u)}#t=0.5" controls preload="metadata" playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111"></video></div>`:src?`<div class="vf">${th?`<img src="${th}" alt="" loading="lazy">`:""}<button type="button" data-play="${esc(src)}" aria-label="Videoyu oynat"></button></div>`

  return `<div class="vid">${frame}<div class="bd">${meta?`<span class="eyebrow">${meta}</span>`:""}<b>${esc(x.title||"Video")}</b>${u&&!mp4?ext(u,(yt?"YouTube":vm?"Vimeo":ig?"Instagram":hostOf(u))+"'da aç ↗"):""}</div></div>`;}
const igProfile=u=>{const m=String(u||"").match(/instagram\.com\/([A-Za-z0-9_.]+)\/?(?:$|\?)/);return m&&!/^(p|reel|tv|explore)$/.test(m[1])?m[1]:null;};

function runDeck(opt){

  document.addEventListener("keydown",ovKeys);show();}

const PW=1754,PH=1240,PM=72,PDF_INK="#1B1D1C",PDF_MUTED="#6B706D",PDF_LINE="#DAD7CF",PDF_SOFT="#F4F2EC";
const JSPDF_SRC="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
function loadScript(src){return new Promise((res,rej)=>{if(window.jspdf)return res();const s=document.createElement("script");s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error("PDF kütüphanesi yüklenemedi"));document.head.appendChild(s);});}
const pimgCache=new Map();
const bestSrc=m=>m?{m}:null;
function pimg(url){if(url&&typeof url==="object"){const m=url.m;return pimg(blob(m.original||m.asset)).then(im=>im||(m.original?pimg(blob(m.asset)):null));}if(!url)return Promise.resolve(null);if(pimgCache.has(url))return pimgCache.get(url);
  const p=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=url;});pimgCache.set(url,p);return p;}
function fitCover(c,img,x,y,w,h){const s=Math.max(w/img.naturalWidth,h/img.naturalHeight),sw=w/s,sh=h/s;c.drawImage(img,(img.naturalWidth-sw)/2,(img.naturalHeight-sh)/2,sw,sh,x,y,w,h);}
function fitContain(c,img,x,y,w,h,al){const s=Math.min(w/img.naturalWidth,h/img.naturalHeight),dw=img.naturalWidth*s,dh=img.naturalHeight*s;
  const dx=al==="left"?x:al==="right"?x+w-dw:x+(w-dw)/2;c.drawImage(img,dx,y+(h-dh)/2,dw,dh);return {x:dx,y:y+(h-dh)/2,w:dw,h:dh};}
const PF=(sz,w,d)=>`${w||400} ${sz}px ${d?'"Newsreader",Georgia,serif':'"IBM Plex Sans",system-ui,sans-serif'}`;
function ptx(c,s,x,y,o={}){c.font=PF(o.size||22,o.weight,o.d);c.fillStyle=o.color||PDF_INK;c.textAlign=o.align||"left";c.textBaseline="alphabetic";
  let t=String(s??"");if(o.max&&c.measureText(t).width>o.max){while(t.length>1&&c.measureText(t+"…").width>o.max)t=t.slice(0,-1);t+="…";}c.fillText(t,x,y);return c.measureText(t).width;}
function pwrap(c,s,x,y,w,lh,o={}){c.font=PF(o.size||22,o.weight,o.d);const ws=String(s||"").split(/\s+/);let line="",yy=y,n=0;
  for(const wd of ws){const t=line?line+" "+wd:wd;if(c.measureText(t).width>w&&line){ptx(c,line,x,yy,o);yy+=lh;line=wd;if(o.lines&&++n>=o.lines){return yy;}}else line=t;}
  if(line){ptx(c,line,x,yy,o);yy+=lh;}return yy;}
function prule(c,x1,y,x2,col,h){c.fillStyle=col||PDF_LINE;c.fillRect(x1,y,x2-x1,h||2);}
function pdot(c,x,y,name){c.fillStyle=TIER_HEX[name]||"#999";c.beginPath();c.arc(x,y,9,0,Math.PI*2);c.fill();}
const TIER_HEX={Silver:"#A9AEB1",Gold:"#C8A24A",Platinum:"#8C9BA5",Pearl:"#D9CFC0",Emerald:"#2E7D5B",Diamond:"#6FA8C7",Royal:"#6D4C8F"};
function pFrame(c,L,pg,total,title){c.fillStyle="#fff";c.fillRect(0,0,PW,PH);

const DRIVE="Google Drive";
const driveId=s=>{s=String(s||"").trim();const m=s.match(/folders\/([A-Za-z0-9_-]{10,})/)||s.match(/[?&]id=([A-Za-z0-9_-]{10,})/);return m?m[1]:(/^[A-Za-z0-9_-]{10,}$/.test(s)?s:"");};

function driveNames(list){const firmOf=b=>pkgByName(b)?.firm||b||"Ortak";const used=new Map();const seen=new Set();const out=[];
  S.media.filter(m=>(m.kind||"render")==="render").sort(byOrder).forEach(m=>{const k=[m.villa,m.brand,m.room,m.fileName].join("|");if(seen.has(k))return;seen.add(k);

    out.push({m,firm:firmOf(m.brand),villa:m.villa||"Genel",base:`${base} ${String(n).padStart(2,"0")}`});});

async function driveCall(tool,input){const r=await S.mcp.callTool(DRIVE,tool,input,{cache:false});return r&&r.payload!==undefined?r.payload:r;}
async function driveChildFolder(parent,name,create){
  const p=await driveCall("search_files",{query:`parentId = '${dq(parent)}' and mimeType = 'application/vnd.google-apps.folder'`,pageSize:100,excludeContentSnippets:true});
  const fs=driveFiles(p);const want=normB(name);const hit=fs.find(f=>normB(f.title||f.name)===want)||fs.find(f=>{const t=normB(f.title||f.name);return t&&(want.startsWith(t)||t.startsWith(want));});
  if(hit)return hit.id;if(!create)return null;
  const c=await driveCall("create_file",{title:name,contentMimeType:"application/vnd.google-apps.folder",parentId:parent});return c.id;}
async function driveHas(parent,title){const p=await driveCall("search_files",{query:`parentId = '${dq(parent)}' and title = '${dq(title)}'`,pageSize:5,excludeContentSnippets:true});return driveFiles(p).length>0;}
const b64=buf=>{const u=new Uint8Array(buf);let s="";for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);};
async function runDriveExport(list,root,box){
  const st=box.querySelector("#drvStatus"),bar=box.querySelector("#drvBar i"),log=box.querySelector("#drvLog");const say=t=>st.textContent=t;
  const row=(t,cls)=>{const d=document.createElement("div");d.className="drvrow "+(cls||"");d.textContent=t;log.prepend(d);};
  let fileArgs=false;try{const lt=await S.mcp.listTools();fileArgs=!!lt.fileArgs;}catch(e){}
  const jobs=driveNames(list);const cache=new Map();let ok=0,skip=0,fail=0;
  const folder=async(path)=>{const key=path.join("/");if(cache.has(key))return cache.get(key);let id=root;for(let i=0;i<path.length;i++){const k=path.slice(0,i+1).join("/");if(cache.has(k)){id=cache.get(k);continue;}id=await driveChildFolder(id,path[i],true);cache.set(k,id);}return id;};
  for(let i=0;i<jobs.length;i++){const j=jobs[i];bar.style.width=(i/jobs.length*100)+"%";say(`${i+1} / ${jobs.length} · ${j.base}`);
    try{const res=await fetch(blob(j.m.original||j.m.asset));if(!res.ok)throw new Error("Görsel okunamadı");const bl=await res.blob();
      const type=bl.type||"image/jpeg",ext=type.includes("png")?"png":type.includes("webp")?"webp":"jpg",title=`${j.base}.${ext}`;
      const parent=await folder([j.firm,"Renders",j.villa]);
      if(await driveHas(parent,title)){skip++;row(`Zaten var · ${j.firm}/Renders/${j.villa}/${title}`,"skip");continue;}
      const input={title,contentMimeType:type,parentId:parent,disableConversionToGoogleType:true};
      if(fileArgs)input.base64Content={$file:{data:bl,name:title,type}};
      else if(bl.size<700*1024)input.base64Content=b64(await bl.arrayBuffer());
      else throw new Error("Dosya bu görünümde doğrudan yüklenemeyecek kadar büyük");

    catch(e){fail++;const c=e&&e.code;row(`Hata · ${j.base}: ${c==="not_in_manifest"||c==="approval_required"?"Google Drive izni verilmedi":c==="server_not_connected"?"Google Drive bağlı değil":(e&&e.message)||"yüklenemedi"}`,"bad");
      if(c==="not_in_manifest"||c==="server_not_connected"||c==="needs_reauth"||c==="approval_required")break;}}

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res({img:i,url:u});i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Görsel okunamadı"));};i.src=u;});}
function encodeImg(img,maxW,q){const s=Math.min(1,maxW/img.naturalWidth);const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(b=>{if(b&&b.type==="image/webp")r(b);else c.toBlob(r,"image/jpeg",q);},"image/webp",q));}
const OK_TYPES=["image/jpeg","image/png","image/webp","image/gif","image/svg+xml"];
async function uploadOne(file,meta,row){
  const set=t=>row.lastChild.textContent=t;let main=file,thumbBlob=null;const isSvg=file.type==="image/svg+xml";
  if(!isSvg){set("Hazırlanıyor…");const {img,url}=await loadImg(file);
    if(file.type!=="image/gif"||file.size>19*1024*1024){main=await encodeImg(img,meta.kind==="pano"?8192:3840,meta.kind==="pano"?.86:.84);}
    thumbBlob=await encodeImg(img,meta.kind==="pano"?1000:900,.8);URL.revokeObjectURL(url);}
  set("Yükleniyor…");
  const up=await S.assets.upload(main,{type:main.type||"image/jpeg"});
  let th=null;if(thumbBlob){try{th=(await S.assets.upload(thumbBlob,{type:thumbBlob.type||"image/jpeg"})).id;}catch(e){}}
  await S.db.collection("media").doc().set({...meta,asset:up.id,thumb:th,order:Date.now(),createdAt:new Date().toISOString(),fileName:file.name});
  set("Yüklendi");}

/* ---------- sheet parsing ---------- */
function parseNum(s){if(typeof s==="number")return s;s=String(s==null?"":s).replace(/SAR|USD|\s| /g,"");if(!s||s==="-")return 0;const isPct=s.includes("%");s=s.replace("%","");
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");

function parseVeri(rows){
  const out={brands:null,villas:[],sections:[],rates:{},layers:{}};let mode=null,bnames=[];const vals={};
  for(const raw of rows){const cells=(raw||[]).map(x=>String(x==null?"":x).trim());let i=0;while(i<cells.length&&cells[i]==="")i++;const r=cells.slice(i);
    if(!r.length){if(mode==="tbl")mode="done";continue;}
    const lab=r[0];
    if(/^KDV oran/i.test(lab))out.vat=parseNum(r[1]);
    else if(/^Proje villa adedi/i.test(lab))out.villaCount=parseNum(r[1]);
    else if(/^Kur/i.test(lab))out.fx=parseNum(r[1]);
    if(/Villa\s*×\s*bölüm/i.test(lab)){out.currency=/USD/.test(lab)?"USD":/SAR/.test(lab)?"SAR":null;}
    if(mode!=="done"&&lab==="Villa"&&r[1]==="Bölüm"){bnames=r.slice(2).filter(x=>x&&!/^[-\d.,\s]+(SAR|USD)?$/i.test(x));mode="tbl";continue;}
    if(mode==="tbl"&&/^Villa/i.test(lab)&&r.length>=3){const v=lab,s=r[1];if(!out.villas.includes(v))out.villas.push(v);if(!out.sections.includes(s))out.sections.push(s);
      bnames.forEach((b,bi)=>{vals[b]=vals[b]||{};vals[b][v]=vals[b][v]||[];vals[b][v][out.sections.indexOf(s)]=parseNum(r[2+bi]);});continue;}
    if(lab==="Villa"&&r[1]==="Kalem"){out.layerHdr=r.slice(2).filter(x=>x&&!/^[-\d.,\s]+(SAR|USD)?$/i.test(x));continue;}
    const lk=Object.keys(RATE_LABELS).find(k=>lab.startsWith(k));
    if(out.layerHdr&&/^Villa/i.test(lab)&&RATE_LABELS[r[1]]){out.layerHdr.forEach((b,bi)=>{(((out.layers[b]=out.layers[b]||{})[lab]=out.layers[b][lab]||{}))[RATE_LABELS[r[1]]]=parseNum(r[2+bi]);});continue;}
    if(lk&&!/^Villa/i.test(lab)){let v=r.slice(1);if(v[0]==="")v=v.slice(1);if(v.some(x=>/%/.test(x)))out.rates[RATE_LABELS[lk]]=v.map(x=>/%/.test(x)?parseNum(x):null);}}
  if(!bnames.length)return null;
  out.brands=bnames.map((b,bi)=>({name:b,values:vals[b]||{},layers:out.layers[b]||null,rates:{freight:out.rates.freight?.[bi],assembly:out.rates.assembly?.[bi],insurance:out.rates.insurance?.[bi]}}));
  return out;}
function parseHam(rows){ // Firma, Villa, Bölüm, Kod, Kalem, Marka, Tip, Toplam, Kalem mi  (Marka is dropped on purpose)
  const out={};if(!rows?.length)return out;const h=rows[0].map(x=>String(x).trim());const ix=k=>h.indexOf(k);
  const F=ix("Firma"),V=ix("Villa"),B=ix("Bölüm"),K=ix("Kod"),N=ix("Kalem"),M=ix("Marka"),T=ix("Tip"),P=ix("Toplam"),Q=ix("Kalem mi"),A=ix("Adet"),MD=ix("Model");if(F<0||V<0||P<0)return out;
  rows.slice(1).forEach(r=>{if(Q>=0&&!/^true$/i.test(String(r[Q]||"").trim()))return;const f=String(r[F]||"").trim();if(!f)return;const v=String(r[V]||"").trim();
    ((out[f]=out[f]||{})[v]=out[f][v]||[]).push({f:String(r[B]||"").trim(),c:String(r[K]||"").trim(),n:String(r[N]||"").trim(),b:M>=0?String(r[M]||"").trim():"",t:String(r[T]||"").trim(),v:parseNum(r[P]),...(A>=0&&String(r[A]??"").trim()!==""?{q:parseNum(r[A])}:{}),...(MD>=0&&String(r[MD]??"").trim()!==""?{m:String(r[MD]).trim()}:{})});});

function mergeParsed(p,extraFields){
  const cur=S.cfg||{projectName:"Hayat Mekke",subtitle:"Villa mobilya paketleri",location:"Mekke · Suudi Arabistan",vat:0.15,villaCount:250,fx:3.75,villaMeta:{}};
  const old=Object.fromEntries((cur.brands||[]).map(b=>[b.name,b]));
  // Package names always follow price order with no gaps: cheapest = Silver, next = Gold, …
  // Suppliers that left the sheet free their name; their images are archived so they never show under another package.
  const oldMap={...(S.keys.bySource||{})};
  const tot=b=>p.villas.reduce((s,v)=>{const f=(b.values[v]||[]).reduce((x,y)=>x+(+y||0),0);const la=b.layers?.[v];const r=b.rates||{};
    return s+f+(la?(+la.freight||0)+(+la.assembly||0)+(+la.insurance||0):f*((+r.freight||0)+(+r.assembly||0)+(+r.insurance||0)));},0);
  const order=p.brands.slice().sort((a,b)=>tot(a)-tot(b));
  const map={};order.forEach((b,i)=>map[b.name]=TIERS[i]||("Paket "+(i+1)));
  const byNorm={};for(const [k,n] of Object.entries(map))byNorm[normB(k)]=n;

let renderPending=false;

function scheduleRender(){
  if(S.busy&&S.view==="admin"){renderPending=true;return;}
  if(S.view==="admin"&&typing()&&S.admin!=="pins"){renderPending=true;return;}
  if($("#overlay").children.length){renderTabs();renderPending=true;return;}
  const y=window.scrollY;render();window.scrollTo({top:y});}

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlockPrices(pw,silent){const e=S.enc;if(!e)return false;
  if(!(window.crypto&&crypto.subtle))throw new Error("Bu tarayıcı şifre çözmeyi desteklemiyor (https gerekli)");

  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(e.salt),iterations:e.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  let txt;try{txt=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(e.iv)},key,b64d(e.ct)));}catch(err){if(!silent)throw new Error("hatalı");return false;}
  const real=JSON.parse(txt);S.cfg=real.config;S.boq=deriveBoq(real.boq);S.locked=false;try{sessionStorage.setItem("hm_pw",pw);}catch(err){}
  S.hero=null;renderLock();const y=window.scrollY;render();window.scrollTo({top:y});return true;}
function lockPrices(){if(!S.mask)return;toast("Çıkış yapıldı · fiyatlar gizli");S.cfg=S.mask.cfg;S.boq=deriveBoq(S.mask.raw||S.mask.boq);S.locked=true;try{sessionStorage.removeItem("hm_pw");}catch(e){}S.hero=null;renderLock();const y=window.scrollY;render();window.scrollTo({top:y});}
function renderLock(){const b=$("#lockBtn");if(!b)return;b.hidden=!S.enc;if(!S.enc)return;
  const ic=d=>`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  b.innerHTML=S.locked?`${ic('<path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/>')}<span>Giriş</span>`
    :`${ic('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>')}<span>Çıkış</span>`;
  b.title=S.locked?"Fiyatları görmek için giriş yapın":"Çıkış yap, fiyatları gizle";
  b.setAttribute("aria-pressed",!S.locked);b.onclick=()=>S.locked?openUnlock():lockPrices();}
function openUnlock(){closeOv();const o=$("#overlay");document.body.style.overflow="hidden";

    <b>Giriş</b><span>Fiyatları görmek için kullanıcı adı ve şifrenizi girin. Giriş yapılmadan villa ve paket fiyatları gizli kalır.</span>
    <input type="text" id="lockUser" autocomplete="username" placeholder="Kullanıcı adı" autocapitalize="none" spellcheck="false" required>
    <input type="password" id="lockPw" autocomplete="current-password" placeholder="Şifre" required>
    <small id="lockErr" role="alert"></small>
    <div class="lockact"><button type="button" class="btn sm" data-x>Vazgeç</button><button class="btn primary sm" id="lockGo">Giriş yap</button></div></form></div></div>`;
  const f=o.querySelector("#lockForm"),inp=o.querySelector("#lockPw"),usr=o.querySelector("#lockUser"),err=o.querySelector("#lockErr");usr.focus();

(async function boot(){

    const D=window.HM_DATA;if(D){S.cfg=D.config||null;S.media=(D.media||[]).map(m=>({...m}));S.boq=deriveBoq(D.boq||{});S.firms=D.firms||{};S.itemImgs=D.itemImages||{};
