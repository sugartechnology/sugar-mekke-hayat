<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Hayat Mekke Villa Sunumu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: quiet property brochure. White page, black type, hairline rules, photographs carry the colour. Single light look by choice. */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F5F5F2; --line:#E6E5E0; --fg:#1C1C1A; --muted:#6E6D67;
  --accent:#41604F; --accent-2:#33503F; --accent-ink:#FFFFFF; --accent-soft:#F2F5F2; --gold:#9A7B4F;
  --good:#3D7A55; --good-bg:transparent; --bad:#A4513C; --bad-bg:transparent; --shade:transparent;
  --f1:#41604F; --f2:#7F9A88; --f3:#B9C9BD; --f4:#DCE5DE; --fx:#D2BE97; --fv:#E4E3DE;
  --display:"Newsreader","Iowan Old Style",Georgia,serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --r:4px; color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:0 64px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em;line-height:1.02}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:lining-nums tabular-nums}
h1,h2,h3,.price-line b,.pcard b,.total b,.cbig b,.stats b,.bigp,.oc b{font-variant-numeric:lining-nums}
@media (max-width:560px){.items tr:not(.grp)>:nth-child(1),.items tr:not(.grp)>:nth-child(3){display:none}.items td.wrap{min-width:0}}
.wrap{max-width:1320px;margin:0 auto}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.cur{font-size:.5em;font-family:var(--body);font-weight:600;color:var(--muted);letter-spacing:.02em;margin-left:.25em}
/* header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);
  margin-inline:calc(-1 * max(20px,env(safe-area-inset-left,0px)));padding-inline:max(20px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.bar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:12px}
.logo{display:flex;align-items:center;gap:11px;background:none;border:0;padding:0;text-align:left}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo i::after{content:"";width:12px;height:12px;border:2px solid var(--accent-ink);transform:rotate(45deg);border-radius:2px}
.logo b{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1}
.logo small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.nav{display:flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.nav button{background:none;border:0;padding:8px 13px;border-radius:999px;color:var(--muted);font-weight:700;font-size:13.5px}
.nav button:hover{color:var(--fg)}
.nav button[aria-current="true"]{color:var(--fg);background:var(--surface-2)}
.bar-actions{display:flex;gap:8px;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px}
.seg button{background:none;border:0;padding:5px 11px;font-size:12px;font-weight:800;color:var(--muted);border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px var(--shade)}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;color:var(--fg);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.light{background:rgba(255,255,255,.92);border-color:transparent;color:#14171A}
.btn.ghost-light{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.35);color:#fff}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.link:hover{text-decoration:underline;text-underline-offset:3px}
main{padding-top:24px;display:grid;gap:64px}
section.block{display:grid;gap:22px}
.head{display:flex;align-items:end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.head h2{font-size:clamp(30px,3.6vw,44px)}
.head p{color:var(--muted);max-width:60ch;margin-top:6px}
/* hero */
.hero{position:relative;border-radius:22px;overflow:hidden;min-height:clamp(420px,64vh,660px);display:flex;align-items:flex-end;background:var(--accent)}
.hero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,11,.05) 20%,rgba(8,12,11,.72) 100%)}
.hero-in{position:relative;z-index:1;padding:clamp(24px,4vw,56px);color:#fff;display:grid;gap:18px;width:100%}
.hero-in .eyebrow{color:rgba(255,255,255,.8)}
.hero-in h1{font-size:clamp(52px,9vw,128px);font-weight:500;line-height:.92;letter-spacing:-.02em}
.hero-in p{font-size:clamp(16px,1.6vw,19px);max-width:46ch;color:rgba(255,255,255,.88)}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid rgba(255,255,255,.25);padding-top:18px;margin-top:10px;gap:16px}
.stats div{display:grid;gap:2px}
.stats b{font-family:var(--display);font-size:clamp(26px,3vw,38px);font-weight:500;line-height:1}
.stats span{font-size:12.5px;color:rgba(255,255,255,.75);font-weight:600}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
/* villa cards */
.vcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.vc{display:grid;grid-template-rows:auto 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;transition:transform .25s,box-shadow .25s}
.vc:hover{transform:translateY(-3px);box-shadow:0 18px 40px -18px var(--shade)}
.ph{position:relative;aspect-ratio:4/3;background:var(--surface-2);overflow:hidden;max-width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.vc:hover .ph img{transform:scale(1.035)}
.ph .tag{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);color:#14171A;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px}
.ph.empty-ph{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--surface-2))}
.ph.empty-ph b{font-family:var(--display);font-size:120px;font-weight:500;color:var(--accent);opacity:.25;line-height:1}
.ph.empty-ph span{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--muted);font-weight:600}
.vc .bd{padding:20px 22px 22px;display:grid;gap:10px;align-content:start}
.vc h3{font-size:34px}
.vc .meta{font-size:13px;color:var(--muted)}
.price-line{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.price-line b{font-family:var(--display);font-size:30px;font-weight:600}
.price-line small{display:block;font-size:12px;color:var(--muted);font-weight:600}
/* package strip on home */
.pstrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;gap:6px;text-align:left}
.pcard:hover{border-color:var(--muted)}
.pcard .nm{display:flex;gap:9px;align-items:center;font-weight:800;font-size:15px}
.pcard b{font-family:var(--display);font-size:26px;font-weight:600;line-height:1}
.pcard small{font-size:12px;color:var(--muted);font-weight:600}
.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
/* villa page */
.crumbs{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.crumb{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);font-weight:600}
.crumb button{background:none;border:0;padding:0;color:var(--muted);font-weight:700}
.crumb button:hover{color:var(--fg)}
.vgrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(320px,1fr);gap:24px;align-items:start}
@media (max-width:980px){.vgrid{grid-template-columns:1fr}}
.gal{display:grid;gap:10px;min-width:0}
.gmain{position:relative;border-radius:var(--r);overflow:hidden;background:var(--surface-2);aspect-ratio:16/10;max-width:100%}
.gmain img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.gmain img.fade{opacity:0}
.gmain .cap{position:absolute;left:0;right:0;bottom:0;padding:48px 20px 16px;background:linear-gradient(transparent,rgba(8,10,9,.7));color:#fff;display:flex;justify-content:space-between;align-items:end;gap:12px}
.gmain .cap b{font-weight:700;font-size:15px;display:block}
.gmain .cap small{color:rgba(255,255,255,.8);font-size:12.5px;font-weight:600}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#14171A;font-size:20px;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.gnav.l{left:14px}.gnav.r{right:14px}
.gtop{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.gtop button{border:0;background:rgba(255,255,255,.9);color:#14171A;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800}
.gthumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.gthumbs button{flex:none;width:96px;aspect-ratio:4/3;border-radius:8px;overflow:hidden;padding:0;border:2px solid transparent;background:var(--surface-2);opacity:.7}
.gthumbs button[aria-current="true"]{border-color:var(--accent);opacity:1}
.gthumbs button:hover{opacity:1}
.gthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.gempty{aspect-ratio:16/10;border-radius:var(--r);background:linear-gradient(135deg,var(--accent-soft),var(--surface-2));display:grid;place-items:center;text-align:center;padding:24px;max-width:100%}
.gempty div{display:grid;gap:10px;justify-items:center;max-width:42ch}
.gempty b{font-family:var(--display);font-size:30px;font-weight:600}
.buy{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:18px;box-shadow:0 20px 50px -30px var(--shade)}
@media (max-width:980px){.buy{position:static}}
.buy h1{font-size:clamp(44px,5vw,60px)}
.buy .meta{font-size:13px;color:var(--muted);margin-top:4px}
.pklist{display:grid;gap:6px}
.pkrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.pkrow:hover{border-color:var(--muted)}
.pkrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.pkrow .n{font-weight:800;font-size:14.5px;display:flex;gap:8px;align-items:center}
.pkrow .n small{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--good);background:var(--good-bg);padding:2px 7px;border-radius:999px}
.pkrow .p{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.pkrow .p small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.total{display:grid;gap:4px;padding-top:16px;border-top:1px solid var(--line)}
.total b{font-family:var(--display);font-size:48px;font-weight:600;line-height:1}
.total .sub{font-size:13px;color:var(--muted)}
.buy .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* floors + rooms */
.ftabs{display:flex;gap:6px;flex-wrap:wrap}
.ftabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;font-size:13.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.ftabs button span{font-weight:600;font-size:12px;font-variant-numeric:tabular-nums}
.ftabs button[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.rc{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;transition:transform .25s,box-shadow .25s}
.rc:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px var(--shade)}
.rc .ph{aspect-ratio:3/2}
.rc .ph.empty-ph b{font-size:56px}
.rc .bd{padding:14px 16px 16px;display:grid;gap:4px}
.rc .t{font-weight:800;font-size:15px}
.rc .s{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.rc .s b{color:var(--fg);font-variant-numeric:tabular-nums}
.b360{position:absolute;right:12px;top:12px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px}
.rlist{display:grid;gap:10px}
.rrows{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.rrow{display:grid;grid-template-columns:1fr auto auto 14px;gap:12px;align-items:center;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left}
.rrow:hover{border-color:var(--muted)}
.rrow .t{font-weight:800;font-size:14px}
.rrow .s{font-size:12.5px;color:var(--muted)}
.rrow b{font-variant-numeric:tabular-nums;font-size:14px}
.rrow .go{color:var(--muted);font-size:18px;line-height:1}
.tbtn{text-align:left;cursor:pointer;font:inherit;color:inherit}
.tbtn:hover{border-color:var(--accent);box-shadow:0 10px 24px -16px var(--shade)}
.tile .l em{font-style:normal;margin-left:auto;color:var(--accent);font-weight:800}
small.ib{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.brands{display:grid;gap:8px}
.brow{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.brow>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(80px,1fr) auto;gap:16px;align-items:center;padding:13px 16px}
.brow>summary::-webkit-details-marker{display:none}
.brow[open]>summary{border-bottom:1px solid var(--line)}
.brow .bn{display:grid;gap:4px;min-width:0}
.brow .bn b{font-size:15px}
.bbar{height:8px;background:var(--surface-2);border-radius:999px;position:relative;overflow:hidden}
.bbar i{position:absolute;inset:0 auto 0 0;border-radius:999px}
.brow .bv{text-align:right;display:grid;font-variant-numeric:tabular-nums}
.brow .bv small{font-size:12px;color:var(--muted)}
@media (max-width:560px){.brow>summary{grid-template-columns:1fr auto}.bbar{grid-column:1/-1;grid-row:2}}
.insight{background:var(--accent-soft);border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5}
.insight b{color:var(--accent)}
.cmpl{display:grid;gap:6px}
.cmpr{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;font-size:13.5px}
.cmpr[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cmpr .nm{display:flex;gap:8px;align-items:center;font-weight:800}
.cmpr b{font-variant-numeric:tabular-nums}
.comp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:12px}
.clegend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--muted)}
.clegend span{display:flex;gap:6px;align-items:center}.clegend i{width:10px;height:10px;border-radius:3px}
.crow{display:grid;grid-template-columns:120px 1fr 90px;gap:14px;align-items:center}
.crow .nm{display:flex;gap:8px;align-items:center;font-weight:800;font-size:14px}
.crow b{text-align:right}
.cbar{display:flex;height:20px;border-radius:6px;overflow:hidden;gap:2px}
.cbar i{display:block;height:100%;min-width:2px}
@media (max-width:560px){.crow{grid-template-columns:1fr auto}.crow .cbar{grid-column:1/-1;grid-row:2}}

/* plan */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.plan-stage{position:relative;background:var(--surface-2);border-radius:10px;overflow:hidden;display:grid;place-items:center;min-height:220px}
.plan-stage img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain}
.plan-inner{position:relative;width:100%}
.pin{position:absolute;transform:translate(-50%,-50%);border:0;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;box-shadow:0 2px 8px rgba(0,0,0,.3);white-space:nowrap}
.pin.pending{background:var(--fg);color:var(--bg)}
/* cost */
.costgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:24px;align-items:start}
@media (max-width:900px){.costgrid{grid-template-columns:1fr}}
.cbig{display:grid;gap:8px}
.cbig b{font-family:var(--display);font-size:clamp(56px,7vw,84px);font-weight:500;line-height:.95}
.cbig .sub{color:var(--muted);font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:6px}
.tile .l{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.tile .l i{width:10px;height:10px;border-radius:3px;flex:none}
.tile b{font-size:22px;font-variant-numeric:tabular-nums;font-weight:800;letter-spacing:-.01em}
.tile small{font-size:12px;color:var(--muted)}
.stack{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--surface-2);gap:2px}
.stack i{display:block;height:100%;min-width:3px}
.more{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.more>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 18px;font-weight:800}
.more>summary::-webkit-details-marker{display:none}
.more>summary::after{content:"+";font-size:20px;font-weight:500;color:var(--muted);line-height:1}
.more[open]>summary::after{content:"–"}
.more>summary small{font-weight:600;color:var(--muted);margin-left:auto;margin-right:8px;font-size:13px;text-align:right}
.more .in{padding:0 18px 18px;display:grid;gap:18px}
.legend{display:grid}
.lg{display:grid;grid-template-columns:12px 1fr auto 56px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lg:last-child{border-bottom:0}
.lg .sw{width:12px;height:12px;border-radius:3px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}

table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}

thead th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;background:var(--surface-2)}

/* other packages */
.others{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}

/* cta band */
.band{background:var(--accent);color:var(--accent-ink);border-radius:22px;padding:clamp(28px,5vw,56px);display:flex;justify-content:space-between;gap:24px;align-items:center;flex-wrap:wrap}

/* compare */

.track{height:10px;background:var(--surface-2);border-radius:999px;position:relative;overflow:hidden}

/* room sheet */
.sheet-wrap{position:fixed;inset:0;z-index:90;background:rgba(10,12,11,.5);display:flex;justify-content:flex-end;animation:fadein .2s ease}
.sheet{width:min(820px,100%);height:100%;background:var(--bg);overflow-y:auto;display:grid;align-content:start;grid-auto-rows:max-content;gap:20px;
  padding:max(20px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) 24px;animation:slidein .28s ease}

@keyframes fadein{from{opacity:0}to{opacity:1}}

.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start}

.xbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:40px;height:40px;font-size:18px;flex:none}
.sheet .sumrow{display:flex;gap:28px;flex-wrap:wrap}

.empty{border:1px dashed var(--line);border-radius:12px;padding:26px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}

.status{font-size:12.5px;color:var(--muted)}
.hr{height:1px;background:var(--line)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;align-content:start;min-width:0}
.villa-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}

.rooms{display:grid;gap:2px;max-height:420px;overflow:auto}
.room{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:none;border:0;text-align:left;width:100%;font-size:14px}
.block-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap}

/* overlays (lightbox, pano) */
.ov{position:fixed;inset:0;z-index:100;background:rgba(8,10,9,.94);display:flex;flex-direction:column;

.ov-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#efede8;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px}

.pano:active{cursor:grabbing}
.pano canvas{display:block;width:100%;height:100%}

.pano-strip{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 14px}

.pano-strip span{display:block;font-size:11px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{color:#bbb;font-size:13px}

.deck{position:fixed;inset:0;z-index:120;background:#0B0E0D;color:#EEECE6;display:flex;flex-direction:column}
.deck .stage{flex:1;min-height:0;position:relative;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;padding:clamp(24px,4vw,64px);padding-left:max(clamp(24px,4vw,64px),env(safe-area-inset-left,0px));padding-right:max(clamp(24px,4vw,64px),env(safe-area-inset-right,0px));gap:20px;animation:fadein .45s ease}

.slide .fill{background:#3F7E6F}.slide .rank-row.best .fill{background:#7CC0AE}
.slide .muted,.slide .rank-row .pos{color:#9AA29E}
.slide td.best{color:#7DC39A}.slide td.worst{color:#E39A84}
.slide .delta{background:#33201B;color:#E39A84}.slide .delta.ok{background:#1A2C22;color:#7DC39A}
.deck-bar{display:flex;align-items:center;gap:10px;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));border-top:1px solid #1E2522;font-size:13px}

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label.f{display:grid;gap:5px;font-size:12px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea,input.cell{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--fg);font-size:14px;width:100%;min-width:0}

.cbig b{font-family:var(--display);font-weight:400;font-size:clamp(52px,6vw,76px)}
.tiles{gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile{border:0;border-radius:0;padding:14px 16px;background:none}
.tile+.tile{border-left:1px solid var(--line)}
.tile .l{font-weight:400}
.tile b{font-weight:500}
.tbtn:hover{background:var(--surface-2);box-shadow:none}
.tile .l em{color:var(--fg);font-weight:500;text-decoration:underline;text-underline-offset:3px}
@media (max-width:640px){.tile+.tile{border-left:0;border-top:1px solid var(--line)}}
.stack{border-radius:0;height:8px}
.insight{background:none;border:0;border-left:2px solid var(--fg);border-radius:0;padding:4px 0 4px 14px;color:var(--muted)}
.insight b{color:var(--fg);font-weight:500}
.more{border:0;border-top:1px solid var(--line);border-radius:0;background:none}
.more>summary{padding:14px 0;font-weight:500}
.more .in{padding:0 0 18px}
.lg.tot{font-weight:600}
.delta{background:none;padding:0;font-weight:500}
.delta.ok{background:none}
.others{gap:24px 20px}
.oc{border:0;border-radius:0;background:none}
.oc .bd{padding:10px 0 0}
.oc .nm{font-weight:500}
.oc .pr b{font-weight:500}
.oc .ph.empty-ph{background:var(--surface-2)!important}
.oc .ph.empty-ph b{display:block;font-family:var(--display);font-weight:400;font-size:28px!important;opacity:.5;color:var(--fg)}
.tbl-wrap{border-radius:0;border-left:0;border-right:0}
thead th{background:none;border-bottom:1px solid var(--fg);font-weight:500;letter-spacing:.02em}
tr.grp td{background:var(--surface-2);font-weight:500}
.typetag{border-radius:0;border:0;padding:0;font-weight:400}
td.best{font-weight:600}
/* sheets & compare */
.sheet-wrap{background:rgba(28,28,26,.25);backdrop-filter:none}
.sheet{background:#fff;box-shadow:-1px 0 0 var(--line)}
.xbtn{border-radius:0}
.cmpr,.brow{border-radius:0}
.cmpr[aria-pressed="true"]{background:var(--surface-2);border-color:var(--fg)}
.rank{border:0;border-radius:0;padding:0;background:none;border-top:1px solid var(--line)}
.rank-row{border-radius:0;border-bottom:1px solid var(--line);padding:12px 0}
.rank-row .pos{font-family:var(--display);font-weight:400}
.track,.fill,.bbar,.bbar i,.tb .t,.tb .t i{border-radius:0}
.comp{border:0;border-radius:0;padding:0;background:none}
.cbar{border-radius:0}
.ph,.h-img{border-radius:0}
.toast{border-radius:var(--r)}
@media (max-width:700px){.bar-in{gap:10px;padding-block:10px}.logo small{display:none}.bar-actions{margin-left:auto}
 .nav{order:3;width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;gap:4px;scrollbar-width:none}.nav button{flex:none}}
</style>

<header class="bar"><div class="bar-in">
  <button class="logo" id="home"><i></i><div><b id="pname">Hayat Mekke</b><small id="psub">Villa mobilya paketleri</small></div></button>
  <nav class="nav" id="tabs" aria-label="Bölümler"></nav>
  <div class="bar-actions">
    <div class="seg" role="group" aria-label="Para birimi"><button id="curUSD" aria-pressed="true">USD</button><button id="curSAR" aria-pressed="false">SAR</button></div>
    <button class="btn primary sm" id="startDeck">Sunum</button>
  </div>
</div></header>
<main class="wrap" id="main">
  <div class="empty" style="margin-top:40px"><strong>Sunum yükleniyor</strong><span>Villa verileri ve görseller birkaç saniye içinde gelecek.</span></div>
</main>
<div id="sheet"></div>
<div id="overlay"></div>

<script src="data/data.js"></script>
<script>
(function(){
"use strict";
const SHEET_RANGE="Veri!A1:J80", HAM_RANGE="Ham!A1:I3000";
const RATE_LABELS={"Navlun ve lojistik":"freight","Montaj ve kurulum":"assembly","Sigorta ve beklenmedik giderler":"insurance"};
const TIERS=["Silver","Gold","Platinum","Pearl","Emerald","Diamond","Royal"];
const TIER_COLOR={Silver:"#BFC3C8",Gold:"#CDA85C",Platinum:"#DCD8CE",Pearl:"#EDE6D8",Emerald:"#2F7A5B",Diamond:"#A9D2E0",Royal:"#5E4C8E"};
const S={cfg:null,keys:{bySource:{},sheetId:""},boq:{},boqDocs:{},media:[],view:"villas",villa:null,pkg:null,floor:null,room:null,gi:0,cur:"USD",
  canEdit:false,db:null,assets:null,mcp:null,dbReady:false,admin:"media",pinPlan:null,pendingPin:null};
try{const v=localStorage.getItem("hm_cur2");if(v==="SAR")S.cur="SAR";}catch(e){}

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf0=new Intl.NumberFormat("tr-TR",{maximumFractionDigits:0});
const nf1=new Intl.NumberFormat("tr-TR",{minimumFractionDigits:1,maximumFractionDigits:1});
const conv=v=>S.cur==="SAR"?v*(S.cfg?.fx||3.75):v;
const money=v=>nf0.format(Math.round(conv(v)));
const big=v=>{const x=conv(v);return x>=1e6?nf1.format(x/1e6)+" M":nf0.format(Math.round(x));};
const pct=v=>nf1.format(v*100)+"%";
const blob=id=>!id?"":(/[\/.]/.test(id)?id:"/_blob/"+id);
const slug=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"x";
const dot=n=>`<span class="dot" style="background:${TIER_COLOR[n]||"var(--muted)"}"></span>`;
const cur=()=>`<span class="cur">${S.cur}</span>`;
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

/* ---------- BoQ labels (English source → Turkish display) ---------- */
const ROOMS=[["Powder Bathroom","Misafir WC"],["Maid Room","Hizmetli odası"],["Maid Bath","Hizmetli banyosu"],["Guest Basin","Misafir lavabosu"],["Guest Entrance","Giriş holü"],
 ["Driver Room","Şoför odası"],["Driver WC","Şoför WC"],["Master Bedroom","Ebeveyn yatak odası"],["Walk-In Closet","Giyinme odası"],["Family Living","Aile salonu"],["Living Room","Salon"],
 ["Bedroom-1","Yatak odası 1"],["Bedroom-2","Yatak odası 2"],["Bedroom-3","Yatak odası 3"],["Bathroom","Banyo"],["Kitchen","Mutfak"],["Majlis","Meclis"],["Rawashin","Rawashin"],
 ["Terrace","Teras"],["Hallway","Koridor"],["Storage","Depo"]];
const ITEMS=[["Cabinetry + Quartz Countertop","Mutfak dolapları + kuvars tezgâh"],["Outdoor lounge chair","Dış mekân şezlongu"],["3-Seater Sofa","Üçlü kanepe"],["2-Seater Sofa","İkili kanepe"],
 ["Armchair","Berjer"],["Coffee Table","Orta sehpa"],["Side Table","Yan sehpa"],["TV Console","TV ünitesi"],["Dining Table","Yemek masası"],["Console table","Konsol"],["Bedside Table","Komodin"],
 ["Dressing Table","Makyaj masası"],["Double Bed","Çift kişilik yatak"],["Bed bench","Yatak önü bankı"],["Bathroom Vanity","Lavabo dolabı"],["Base Cabinet","Alt dolap"],["Wall Cabinet","Üst dolap"],
 ["Vanity","Lavabo dolabı"],["Coat Rack","Portmanto"],["Wardrobe","Gardırop"],["Chair","Sandalye"],["Table","Masa"],["Bed","Yatak"]];
const EXTRAS=[["Bed Linen","Nevresim takımları (6 oda × 2 takım, yorgan, yastık)"],["Bathroom Textiles","Banyo tekstili (havlu, bornoz, paspas · 8 banyo)"],["Dining & Kitchen","Mutfak ve sofra seti"],
 ["Carpets","Halı seti (6 oda)"],["Curtains","Perde paketi (karartma + tül)"]];
const TYPES={"Fixed":"Hareketsiz mobilya","Loose Furniture":"Hareketli mobilya","Ev Dekorasyon":"Ev tekstili ve dekorasyon","":"Diğer"};
const TYPE_COLOR={"Loose Furniture":"var(--f1)","Fixed":"var(--f2)","Ev Dekorasyon":"var(--fx)","":"var(--fv)"};
const BRAND_TR={"Kitchen Furniture":"Mutfak mobilyası","Bathroom Furniture":"Banyo mobilyası"};
const brandLabel=b=>!b?"Marka belirtilmemiş":(BRAND_TR[b]||b);
const TYPE_NOTE={"Fixed":"mutfak, banyo dolapları, gardıroplar · yerinde montaj","Loose Furniture":"kanepe, yatak, masa, sandalye","Ev Dekorasyon":"nevresim, havlu, halı, perde, mutfak seti"};
const isExtra=f=>/tamamlay/i.test(f||"");
function labelItem(it){
  const n=String(it.n||"").trim();
  if(isExtra(it.f)){const e=EXTRAS.find(([k])=>n.toLowerCase().startsWith(k.toLowerCase()));return {room:"Ev tekstili ve tamamlayıcılar",label:e?e[1]:(n||"Diğer tamamlayıcı ürünler")};}
  let room="Diğer",rest=n;const r=ROOMS.find(([k])=>n.toLowerCase().startsWith(k.toLowerCase()));
  if(r){room=r[1];rest=n.slice(r[0].length).trim();}
  if(!rest)rest=n;
  const m=rest.match(/\(([^)]*)\)\s*$/);const base=m?rest.slice(0,m.index).trim():rest;
  const t=ITEMS.find(([k])=>base.toLowerCase()===k.toLowerCase())||ITEMS.find(([k])=>base.toLowerCase().startsWith(k.toLowerCase()));
  let label=t?t[1]:base;if(m)label+=" ("+m[1].replace(/~?(\d+)\s*lm/,"~$1 mt")+")";
  return {room,label};}

/* ---------- calculations ---------- */
const villas=()=>S.cfg?.villas||[];
const sections=()=>S.cfg?.sections||[];
const brands=()=>S.cfg?.brands||[];
const floorsOnly=()=>sections().filter(s=>!isExtra(s));
const pkgByName=n=>brands().find(b=>b.name===n);
function furn(b,v){return (b?.values?.[v]||[]).reduce((a,x)=>a+(+x||0),0);}
function extra(b){const r=b?.rates||{};return (+r.freight||0)+(+r.assembly||0)+(+r.insurance||0);}
function layers(b,v){const f=furn(b,v),r=b.rates||{},la=b.layers?.[v];
  const fr=la?(+la.freight||0):f*(+r.freight||0),as=la?(+la.assembly||0):f*(+r.assembly||0),ins=la?(+la.insurance||0):f*(+r.insurance||0);const net=f+fr+as+ins;const vat=net*(S.cfg.vat||0);
  return {furn:f,freight:fr,assembly:as,insurance:ins,extras:fr+as+ins,net,vat,gross:net+vat};}
function net(b,v){return layers(b,v).net;}
function gross(b,v){return net(b,v)*(1+(S.cfg.vat||0));}
function total3(b){return villas().reduce((a,v)=>a+net(b,v),0);}
function avgGross(b){const vs=villas();return vs.length?vs.reduce((a,v)=>a+gross(b,v),0)/vs.length:0;}
function budget(b){return avgGross(b)*(S.cfg.villaCount||0);}
function ranked(){return brands().slice().sort((a,b)=>total3(a)-total3(b));}
function rankedFor(v){return brands().slice().sort((a,b)=>net(a,v)-net(b,v));}
function boqItems(pkg,v){return (S.boq[pkg]?.[v]||[]);}
function roomTotals(pkg,v,floor){const m=new Map();boqItems(pkg,v).filter(it=>!floor||it.f===floor).forEach(it=>{const {room}=labelItem(it);const o=m.get(room)||{v:0,n:0};o.v+=(+it.v||0);o.n++;m.set(room,o);});return m;}
function typeTotals(pkg,v){const m={};boqItems(pkg,v).forEach(it=>{const k=it.t||"";m[k]=(m[k]||0)+(+it.v||0);});return m;}

/* ---------- media helpers ---------- */
const byOrder=(a,b)=>(a.order||0)-(b.order||0);
function mediaOf(f){return S.media.filter(f).sort(byOrder);}
const pkgMatch=(m,pkg)=>!m.brand||!pkg||m.brand===pkg;
const floorIdx=f=>{const i=floorsOnly().indexOf(f);return i<0?99:i;};
function coverImg(villa,pkg,strict){const pool=S.media.filter(m=>m.kind==="render"&&(!villa||m.villa===villa));
  const pref=strict?[x=>x.cover&&x.brand===pkg,x=>x.brand===pkg,x=>x.cover&&!x.brand,x=>!x.brand]:[x=>x.cover&&x.brand===pkg,x=>x.brand===pkg,x=>x.cover&&!x.brand,x=>!x.brand,x=>x.cover,()=>true];
  for(const p of pref){const r=pool.filter(p).sort(byOrder);if(r.length)return r[0];}return null;}
function thumb(m){return blob(m.thumb||m.asset);}
function planFor(v,f,pkg){const ps=mediaOf(m=>m.kind==="plan"&&m.villa===v&&(m.floor===f||!m.floor)).sort((a,b)=>(a.floor===f?0:1)-(b.floor===f?0:1));
  return ps.find(p=>p.brand===pkg)||ps.find(p=>!p.brand)||ps[0]||null;}
function galleryList(v,pkg){return S.media.filter(m=>m.kind==="render"&&m.villa===v&&pkgMatch(m,pkg)).sort((a,b)=>((b.cover?1:0)-(a.cover?1:0))||floorIdx(a.floor)-floorIdx(b.floor)||byOrder(a,b));}
const placeholder=(txt,sub)=>`<div class="ph empty-ph"><b>${esc(txt)}</b>${sub?`<span>${esc(sub)}</span>`:""}</div>`;
const villaLetter=v=>String(v).replace(/^Villa\s*/i,"").slice(0,2)||"V";
const initials=s=>String(s).split(/\s+/).filter(w=>!/^\d+$/.test(w)).slice(0,2).map(w=>w[0]).join("").toUpperCase()+(String(s).match(/\d+$/)?.[0]||"");

/* ---------- header ---------- */
const VIEWS=[["villas","Villalar"],["compare","Paketleri karşılaştır"],["admin","Yönetim"]];
function renderTabs(){
  const curV=S.view==="villa"?"villas":S.view;
  $("#tabs").innerHTML=VIEWS.filter(([k])=>k!=="admin"||S.canEdit).map(([k,l])=>`<button data-view="${k}" aria-current="${curV===k}">${l}</button>`).join("");
  $("#curSAR").setAttribute("aria-pressed",S.cur==="SAR");$("#curUSD").setAttribute("aria-pressed",S.cur==="USD");
  if(S.cfg){$("#pname").textContent=S.cfg.projectName||"Hayat Mekke";$("#psub").textContent=S.cfg.subtitle||"Villa mobilya paketleri";}
}
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(!b)return;setView(b.dataset.view);});
$("#home").onclick=()=>setView("villas");
function setView(v){S.view=v;closeSheet();render();window.scrollTo({top:0,behavior:"instant"});}
function openVilla(v,pkg){S.villa=v;S.pkg=pkg||rankedFor(v)[0]?.name;S.room=null;S.gi=0;S.floor=floorsOnly()[0];setView("villa");}
const setCur=c=>{S.cur=c;try{localStorage.setItem("hm_cur2",c)}catch(e){}const y=window.scrollY;render();window.scrollTo({top:y});if($("#sheet").children.length){if(S.room)openRoom(S.room,true);else if(S.furnTab)openFurn(S.furnTab);}};
$("#curSAR").onclick=()=>setCur("SAR");$("#curUSD").onclick=()=>setCur("USD");
$("#startDeck").onclick=()=>openDeckSetup();

/* ---------- main render ---------- */
function render(){
  renderTabs();const m=$("#main");
  if(S.view==="admin"&&!S.canEdit)S.view="villas";
  if(!S.cfg){
    if(S.view==="admin"){m.innerHTML=adminHTML();bindAdmin();return;}
    m.innerHTML=`<div class="empty" style="margin-top:40px"><strong>${S.dbReady?"Henüz veri yok":"Sunum yükleniyor"}</strong>
      <span>${S.dbReady?(S.canEdit?"Yönetim bölümünden Google Sheets verisini çekin.":"Proje verileri yüklendiğinde sunum burada görünecek."):"Villa verileri ve görseller birkaç saniye içinde gelecek."}</span>
      ${S.dbReady&&S.canEdit?`<button class="btn primary" data-go="admin">Yönetime git</button>`:""}</div>`;
    m.querySelector("[data-go]")?.addEventListener("click",()=>{S.admin="data";setView("admin")});return;}
  if(S.view==="villa"){
    if(!villas().includes(S.villa)){S.view="villas";return render();}
    if(!pkgByName(S.pkg))S.pkg=rankedFor(S.villa)[0]?.name;
    if(!floorsOnly().includes(S.floor))S.floor=floorsOnly()[0];
    m.innerHTML=villaHTML();bindVilla();}
  else if(S.view==="compare"){m.innerHTML=compareHTML();bindCompare();}
  else if(S.view==="admin"){m.innerHTML=adminHTML();bindAdmin();}
  else {S.view="villas";m.innerHTML=listHTML();bindList();}
}

/* ---------- home: villa list ---------- */
function listHTML(){
  const best=ranked()[0];const c=coverImg(null,best?.name);
  const minAll=Math.min(...villas().map(v=>net(rankedFor(v)[0],v)));
  return `<section><div class="intro"><div><span class="eyebrow">${esc(S.cfg.location||"Mekke · Suudi Arabistan")}</span><h1>${esc(S.cfg.projectName||"Hayat Mekke")}</h1></div>
      <div><p>${esc(S.cfg.intro||"Anahtar teslim döşenmiş villalar. Villa tipinizi seçin, mobilya paketinizi belirleyin; odaları ve fiyatı aynı sayfada görün.")}</p>
       <div class="hero-cta"><button class="btn primary" data-scroll="villas">Villaları incele</button><button class="btn" data-deck>Sunumu başlat</button></div></div></div>
     ${c?`<div class="cover"><img src="${blob(c.asset)}" alt="${esc(c.title||"")}"></div><div class="caption-line"><span>${esc(c.title||c.room||"")}</span><span>${esc([c.villa,c.brand?c.brand+" paketi":""].filter(Boolean).join(" · "))}</span></div>`:""}
     <div class="facts"><div><b>${villas().length}</b><span>villa tipi</span></div><div><b>${brands().length}</b><span>mobilya paketi</span></div>
      <div><b>${nf0.format(S.cfg.villaCount||0)}</b><span>villa</span></div><div><b>${money(minAll)} ${S.cur}</b><span>başlangıç fiyatı, KDV hariç</span></div></div></section>
  <section class="block" id="villas"><div class="head"><div><h2>Villa tipleri</h2></div>
    <p>Fiyatlar mobilya, navlun, montaj ve sigorta dahil, KDV hariçtir.</p></div>
   <div class="vcards">${villas().map(v=>{const r=rankedFor(v);const lo=r[0],hi=r[r.length-1];const cv=coverImg(v,lo?.name);const meta=S.cfg.villaMeta?.[v]||{};
     const nR=S.media.filter(m=>m.villa===v&&m.kind==="render").length;
     return `<button class="vc" data-villa="${esc(v)}">${cv?`<div class="ph"><img src="${thumb(cv)}" alt="" loading="lazy"><span class="tag">${nR} görsel</span></div>`:placeholder("","Görseller hazırlanıyor")}
      <div class="bd"><h3>${esc(v)}</h3><span class="meta">${esc([meta.area?meta.area+" m²":"",meta.rooms,meta.desc].filter(Boolean).join(" · ")||"3 katlı villa · zemin, 1. kat ve çatı katı")}</span>
       <div class="price-line"><div><small>Başlangıç · ${esc(lo?.name)}</small><b class="num">${money(net(lo,v))}${cur()}</b></div>
        <div style="text-align:right"><small>${r.length} paket</small><span class="num muted" style="font-size:13px;font-weight:600">en yüksek ${money(net(hi,v))}</span></div></div>
       <span class="link">Villayı incele</span></div></button>`;}).join("")}</div></section>
  <section class="block"><div class="head"><div><h2>Mobilya paketleri</h2></div>
    <p>${esc(S.cfg.scope||"Her paket aynı metraj ve aynı kalem listesiyle fiyatlandırıldı.")} Hareketsiz mobilya ve ev tekstili tüm paketlerde aynı; fark hareketli mobilyanın seviyesinden gelir.</p></div>
   <div class="pstrip">${ranked().map((b,i)=>`<button class="pcard" data-cmp><span class="nm">${dot(b.name)}${esc(b.name)}</span><b class="num">${money(avgGross(b))}${cur()}</b><small>villa başı ort. · KDV dahil${i===0?" · en uygun":""}</small></button>`).join("")}</div></section>
  ${best?`<section class="band"><div><h2>Projenin tamamı ${esc(best.name)} ile ${big(budget(best))} ${S.cur}</h2><p>${nf0.format(S.cfg.villaCount||0)} villa · KDV dahil · villa başı ortalama ${money(avgGross(best))} ${S.cur}</p></div>
    <button class="btn light" data-cmp>Tüm paketleri karşılaştır →</button></section>`:""}`;}
function bindList(){const m=$("#main");
  m.querySelectorAll("[data-villa]").forEach(b=>b.onclick=()=>openVilla(b.dataset.villa));
  m.querySelectorAll("[data-cmp]").forEach(b=>b.onclick=()=>setView("compare"));
  m.querySelector("[data-scroll]")?.addEventListener("click",()=>$("#villas").scrollIntoView());
  m.querySelector("[data-deck]")?.addEventListener("click",()=>openDeckSetup());}

/* ---------- villa page ---------- */
function galleryHTML(list,v,b){
  if(!list.length){const others=rankedFor(v).filter(x=>x!==b).map(x=>({p:x,n:S.media.filter(m=>m.villa===v&&m.kind==="render"&&m.brand===x.name).length})).filter(x=>x.n);
    return `<div class="gempty"><div><b>${esc(b.name)} için görseller hazırlanıyor</b><span class="muted">Fiyat, odalar ve kalem listesi aşağıda.</span>
      ${others.length?`<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${others.map(x=>`<button class="btn sm" data-pkg="${esc(x.p.name)}">${dot(x.p.name)} ${esc(x.p.name)} görsellerini gör</button>`).join("")}</div>`:""}</div></div>`;}
  const gi=Math.min(S.gi,list.length-1);const m=list[gi];
  return `<div class="gmain"><img id="gImg" src="${blob(m.asset)}" alt="${esc(m.title||m.room||"")}">
    <div class="gtop"><button data-gfull>Tam ekran</button></div>
    ${list.length>1?`<button class="gnav l" data-gstep="-1" aria-label="Önceki">‹</button><button class="gnav r" data-gstep="1" aria-label="Sonraki">›</button>`:""}
    <div class="cap"><div><b id="gTitle">${esc(m.title||m.room||"Render")}</b><small id="gSub">${esc([m.floor,b.name].filter(Boolean).join(" · "))}</small></div><small class="num" id="gCnt">${gi+1} / ${list.length}</small></div></div>
   ${list.length>1?`<div class="gthumbs">${list.map((x,i)=>`<button data-gi="${i}" aria-current="${i===gi}" aria-label="${esc(x.title||"")}"><img src="${thumb(x)}" alt="" loading="lazy"></button>`).join("")}</div>`:""}`;}
function villaHTML(){
  const v=S.villa,b=pkgByName(S.pkg),f=S.floor,meta=S.cfg.villaMeta?.[v]||{};const r=rankedFor(v),lo=r[0];const L=layers(b,v);
  const list=galleryList(v,b.name);
  const plan=planFor(v,f,b.name);

function extrasNote(b,v,L){return b.layers?.[v]?`navlun ${money(L.freight)} (villa başı sabit) · montaj ${money(L.assembly)}`:`mobilya bedelinin %${nf1.format(L.extras/L.furn*100)}'i`;}
function rateLabel(b,v,k,L){if(b.layers?.[v]){if(k==="freight")return "villa başı sabit tutar";return "mobilya bedelinin %"+nf1.format((k==="assembly"?L.assembly:L.insurance)/L.furn*100)+"'i";}return "%"+nf1.format((+b.rates?.[k]||0)*100);}
function fixedInsight(v){ // fixed furniture + home textiles identical across packages → price difference comes only from loose furniture
  const bs=rankedFor(v);if(bs.length<2||!bs.every(b=>boqItems(b.name,v).length))return null;
  const tt=bs.map(b=>typeTotals(b.name,v));const fx=tt.map(t=>t["Fixed"]||0);const same=Math.max(...fx)-Math.min(...fx)<=Math.max(5,fx[0]*0.005);
  if(!same)return null;const lo=tt.map(t=>t["Loose Furniture"]||0);return {fixed:fx[0],looseMin:Math.min(...lo),looseMax:Math.max(...lo),lo:bs[lo.indexOf(Math.min(...lo))],hi:bs[lo.indexOf(Math.max(...lo))]};}
function itemRows(arr){return arr.map(it=>`<tr><td class="muted">${esc(it.c||"")}</td><td class="wrap">${esc(it.label)}${it.b!==undefined?`<small class="ib">${esc(brandLabel(it.b))}</small>`:""}</td><td style="text-align:left"><span class="typetag">${esc(TYPES[it.t||""]||it.t)}</span></td><td class="${+it.v?"":"zero"}">${+it.v?money(+it.v):"dahil"}</td></tr>`).join("");}
function boqHTML(pkg,v){

    const groups=new Map();its.forEach(it=>{const L=labelItem(it);if(!groups.has(L.room))groups.set(L.room,[]);groups.get(L.room).push({...it,label:L.label});});
    const tot=its.reduce((a,x)=>a+(+x.v||0),0);

      ${[...groups.entries()].map(([room,arr])=>`<tr class="grp"><td colspan="3" style="text-align:left">${esc(room)}</td><td>${money(arr.reduce((a,x)=>a+(+x.v||0),0))}</td></tr>`+itemRows(arr)).join("")}
      </tbody></table></div></details>`;}).join("");}

function rankingHTML(){

  return `<div class="rank">${r.map((b,i)=>{const t=total3(b),d=(t-min)/min;

      <div class="track"><i class="fill" style="width:${(t/max*100).toFixed(1)}%"></i></div>

function villaMatrixHTML(){
  const bs=ranked(),vs=villas();

   ${bs.map(b=>`<tr><td><span style="display:inline-flex;gap:8px;align-items:center;font-weight:800">${dot(b.name)}${esc(b.name)}</span></td>${vs.map(v=>{const mn=Math.min(...bs.map(x=>net(x,v)));return `<td class="${net(b,v)===mn?"best":""}"><button class="cellbtn" data-open="${esc(v)}|${esc(b.name)}">${money(net(b,v))}</button></td>`;}).join("")}
     <td><b>${money(total3(b))}</b></td><td>${money(avgGross(b))}</td><td>${big(budget(b))}</td></tr>`).join("")}</tbody></table></div>`;}
function matrixHTML(){
  const bs=ranked(),vs=villas(),secs=sections();
  let rows="";vs.forEach(v=>{rows+=`<tr class="grp"><td colspan="${bs.length+1}" style="text-align:left">${esc(v)}</td></tr>`;secs.forEach((s,i)=>{const vals=bs.map(b=>+b.values?.[v]?.[i]||0),mn=Math.min(...vals),mx=Math.max(...vals);

  return `<div class="tbl-wrap"><table><thead><tr><th>Bölüm</th>${bs.map(b=>`<th>${esc(b.name)}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;}
function compositionHTML(){
  const bs=ranked(),vs=villas();if(!bs.every(b=>vs.every(v=>boqItems(b.name,v).length)))return "";
  const SEG=[["Loose Furniture","Hareketli mobilya","var(--f1)"],["Fixed","Hareketsiz mobilya","var(--f2)"],["Ev Dekorasyon","Ev tekstili","var(--f3)"],["_other","Diğer kalemler","var(--f4)"],["_fr","Navlun","var(--fx)"],["_as","Montaj ve sigorta","var(--fv)"]];
  const rows=bs.map(b=>{const o={};SEG.forEach(([k])=>o[k]=0);vs.forEach(v=>{const t=typeTotals(b.name,v);const L=layers(b,v);const keys=Object.keys(t);const typed=keys.reduce((x,k)=>x+(t[k]||0),0);const f=typed?L.furn/typed:0;keys.forEach(k=>{const kk=["Loose Furniture","Fixed","Ev Dekorasyon"].includes(k)?k:"_other";o[kk]+=(t[k]||0)*f;});o._fr+=L.freight;o._as+=L.assembly+L.insurance;});
    o.tot=SEG.reduce((a,[k])=>a+o[k],0);return {b,o};});

   ${rows.map(({b,o})=>`<div class="crow"><span class="nm">${dot(b.name)}${esc(b.name)}</span><div class="cbar" style="width:${(o.tot/mx*100).toFixed(1)}%">${segs.map(([k,l,c])=>o[k]>0.5?`<i style="flex:${o[k]};background:${c}" title="${l}: ${money(o[k])}"></i>`:"").join("")}</div><b class="num">${money(o.tot)}</b></div>`).join("")}</div>
   <div class="tbl-wrap"><table><thead><tr><th>Paket</th>${segs.map(([k,l])=>`<th>${l}</th>`).join("")}<th>Toplam</th></tr></thead><tbody>
    ${rows.map(({b,o})=>`<tr><td><span style="display:inline-flex;gap:8px;align-items:center;font-weight:800">${dot(b.name)}${esc(b.name)}</span></td>${segs.map(([k])=>`<td>${money(o[k])}</td>`).join("")}<td><b>${money(o.tot)}</b></td></tr>`).join("")}</tbody></table></div></section>`;}

/* ---------- panorama viewer ---------- */
function PanoViewer(el){
  if(!window.THREE){el.innerHTML=`<div class="pano-hint">360° görüntüleyici yüklenemedi. Sayfayı yenileyin.</div>`;return {load(){},destroy(){}};}
  const T=window.THREE;const r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));r.outputEncoding=T.sRGBEncoding;
  el.appendChild(r.domElement);const hint=document.createElement("div");hint.className="pano-hint";hint.textContent="Sürükleyerek bakın · tekerlek ya da iki parmakla yakınlaştırın";el.appendChild(hint);
  const scene=new T.Scene(),cam=new T.PerspectiveCamera(75,1,1,1100),geo=new T.SphereGeometry(500,64,40);geo.scale(-1,1,1);
  const mat=new T.MeshBasicMaterial({color:0x222222}),mesh=new T.Mesh(geo,mat);scene.add(mesh);
  let lon=0,lat=0,fov=75,alive=true,auto=true,raf=0,pts=new Map(),pinch=0,tex=null;
  const size=()=>{const w=el.clientWidth||1,h=el.clientHeight||1;r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();};
  const ro=new ResizeObserver(size);ro.observe(el);size();
  const frame=()=>{if(!alive)return;if(auto&&!pts.size)lon+=0.035;lat=Math.max(-85,Math.min(85,lat));
    const phi=T.MathUtils.degToRad(90-lat),th=T.MathUtils.degToRad(lon);cam.fov=fov;cam.updateProjectionMatrix();
    cam.lookAt(500*Math.sin(phi)*Math.cos(th),500*Math.cos(phi),500*Math.sin(phi)*Math.sin(th));r.render(scene,cam);raf=requestAnimationFrame(frame);};
  frame();const stop=()=>{auto=false;hint.remove();};
  el.addEventListener("pointerdown",e=>{stop();el.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const [a,b]=[...pts.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);}});
  el.addEventListener("pointermove",e=>{const p=pts.get(e.pointerId);if(!p)return;
    if(pts.size===2){p.x=e.clientX;p.y=e.clientY;const [a,b]=[...pts.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);if(pinch){fov=Math.max(30,Math.min(95,fov*(pinch/d)));}pinch=d;return;}
    const k=0.12*(fov/75);lon-=(e.clientX-p.x)*k;lat+=(e.clientY-p.y)*k;p.x=e.clientX;p.y=e.clientY;});
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2)pinch=0;};el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
  el.addEventListener("wheel",e=>{e.preventDefault();stop();fov=Math.max(30,Math.min(95,fov+e.deltaY*0.04));},{passive:false});
  return {
    load(url,onDone){const img=new Image();img.onload=()=>{if(!alive)return;const max=Math.min(r.capabilities.maxTextureSize||4096,8192);let src=img;
        if(img.naturalWidth>max){const c=document.createElement("canvas");c.width=max;c.height=Math.round(img.naturalHeight*max/img.naturalWidth);c.getContext("2d").drawImage(img,0,0,c.width,c.height);src=c;}
        if(tex)tex.dispose();tex=new T.Texture(src);tex.encoding=T.sRGBEncoding;tex.minFilter=T.LinearFilter;tex.generateMipmaps=false;tex.needsUpdate=true;
        mat.map=tex;mat.color.set(0xffffff);mat.needsUpdate=true;lon=0;lat=0;fov=75;onDone&&onDone(true);};
      img.onerror=()=>onDone&&onDone(false);img.src=url;},
    destroy(){alive=false;cancelAnimationFrame(raf);ro.disconnect();if(tex)tex.dispose();geo.dispose();mat.dispose();r.dispose();el.innerHTML="";}
  };}
function openPano(id){closeOv();const first=S.media.find(m=>m.id===id);if(!first)return;const o=$("#overlay");document.body.style.overflow="hidden";

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>res({img:i,url:u});i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Görsel okunamadı"));};i.src=u;});}
function toJpeg(img,maxW,q){const s=Math.min(1,maxW/img.naturalWidth);const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",q));}
const OK_TYPES=["image/jpeg","image/png","image/webp","image/gif","image/svg+xml"];
async function uploadOne(file,meta,row){
  const set=t=>row.lastChild.textContent=t;let main=file,thumbBlob=null;const isSvg=file.type==="image/svg+xml";

    if(file.size>19*1024*1024||!OK_TYPES.includes(file.type)){main=await toJpeg(img,meta.kind==="pano"?8192:6000,.88);}
    thumbBlob=await toJpeg(img,meta.kind==="pano"?1000:900,.8);URL.revokeObjectURL(url);}
  set("Yükleniyor…");
  const up=await S.assets.upload(main,{type:main.type||"image/jpeg"});
  let th=null;if(thumbBlob){try{th=(await S.assets.upload(thumbBlob,{type:"image/jpeg"})).id;}catch(e){}}
  await S.db.collection("media").doc().set({...meta,asset:up.id,thumb:th,order:Date.now(),createdAt:new Date().toISOString(),fileName:file.name});
  set("Yüklendi");}

  inp.onchange=()=>run(inp.files);

    card.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("change",async()=>{const v=el.value.trim()||null;try{await doc.update({[el.dataset.k]:v});toast("Kaydedildi");}catch(e){toast("Kaydedilemedi");}}));
    card.querySelectorAll("[data-act]").forEach(b=>b.onclick=async()=>{const a=b.dataset.act;const it=S.media.find(x=>x.id===id);if(!it)return;
      try{
      if(a==="cover"){await doc.update({cover:!it.cover});}
      else if(a==="pins"){S.pinPlan=id;S.admin="pins";render();}
      else if(a==="up"||a==="down"){const peers=mediaOf(x=>x.kind===it.kind&&x.villa===it.villa&&(x.brand||"")===(it.brand||""));const i=peers.findIndex(x=>x.id===id);const j=a==="up"?i-1:i+1;
        if(j<0||j>=peers.length)return;const o=peers[j];const oi=it.order||0,oo=o.order||0;await doc.update({order:oo===oi?oo-1:oo});await S.db.doc("media/"+o.id).update({order:oi});}
      else if(a==="del"){if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Silmek için tekrar tıkla";setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="Sil";}},3500);return;}
        await doc.delete();for(const aid of [it.asset,it.thumb].filter(Boolean)){try{await S.assets.delete(aid);}catch(e){}}toast("Silindi");}
      }catch(e){toast("İşlem yapılamadı");}});});}
function bindPins(m){
  const sel=m.querySelector("#pinSel");if(!sel)return;sel.onchange=()=>{S.pinPlan=sel.value;S.pendingPin=null;render();};
  const st=m.querySelector("#pinStage");st.addEventListener("click",e=>{const r=st.getBoundingClientRect();S.pendingPin={x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height};render();setTimeout(()=>$("#pinName")?.focus(),0);});
  const plan=S.media.find(x=>x.id===S.pinPlan);const doc=S.db.doc("media/"+S.pinPlan);
  const add=async()=>{const n=$("#pinName").value.trim();if(!n){toast("Oda adı yazın");return;}const pins=[...(plan.pins||[]),{x:+S.pendingPin.x.toFixed(4),y:+S.pendingPin.y.toFixed(4),room:n}];
    try{await doc.update({pins});S.pendingPin=null;toast("İşaret eklendi");}catch(e){toast("Kaydedilemedi");}};
  m.querySelector("#pinAdd")?.addEventListener("click",add);m.querySelector("#pinName")?.addEventListener("keydown",e=>{if(e.key==="Enter")add();});
  m.querySelector("#pinCancel")?.addEventListener("click",()=>{S.pendingPin=null;render();});
  m.querySelectorAll("[data-delpin]").forEach(b=>b.onclick=async()=>{const pins=(plan.pins||[]).filter((_,i)=>i!==+b.dataset.delpin);try{await doc.update({pins});}catch(e){toast("Kaydedilemedi");}});}

/* ---------- sheet parsing ---------- */
function parseNum(s){if(typeof s==="number")return s;s=String(s==null?"":s).replace(/SAR|USD|\s| /g,"");if(!s||s==="-")return 0;const isPct=s.includes("%");s=s.replace("%","");
  if(/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s))s=s.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s))s=s.replace(/,/g,"");
  else if(s.includes(",")&&!s.includes("."))s=s.replace(",",".");
  const n=parseFloat(s);return isNaN(n)?0:(isPct?n/100:n);}
function parseVeri(rows){
  const out={brands:null,villas:[],sections:[],rates:{},layers:{}};let mode=null,bnames=[];const vals={};
  for(const raw of rows){const cells=(raw||[]).map(x=>String(x==null?"":x).trim());let i=0;while(i<cells.length&&cells[i]==="")i++;const r=cells.slice(i);
    if(!r.length){if(mode==="tbl")mode="done";continue;}
    const lab=r[0];
    if(/^KDV oran/i.test(lab))out.vat=parseNum(r[1]);
    else if(/^Proje villa adedi/i.test(lab))out.villaCount=parseNum(r[1]);
    else if(/^Kur/i.test(lab))out.fx=parseNum(r[1]);
    if(/Villa\s*×\s*bölüm/i.test(lab)){out.currency=/USD/.test(lab)?"USD":/SAR/.test(lab)?"SAR":null;}
    if(mode!=="done"&&lab==="Villa"&&r[1]==="Bölüm"){bnames=r.slice(2).filter(x=>x&&!/^[-\d.,\s]+(SAR|USD)?$/i.test(x));mode="tbl";continue;}
    if(mode==="tbl"&&/^Villa/i.test(lab)&&r.length>=3){const v=lab,s=r[1];if(!out.villas.includes(v))out.villas.push(v);if(!out.sections.includes(s))out.sections.push(s);
      bnames.forEach((b,bi)=>{vals[b]=vals[b]||{};vals[b][v]=vals[b][v]||[];vals[b][v][out.sections.indexOf(s)]=parseNum(r[2+bi]);});continue;}
    if(lab==="Villa"&&r[1]==="Kalem"){out.layerHdr=r.slice(2).filter(x=>x&&!/^[-\d.,\s]+(SAR|USD)?$/i.test(x));continue;}
    const lk=Object.keys(RATE_LABELS).find(k=>lab.startsWith(k));
    if(out.layerHdr&&/^Villa/i.test(lab)&&RATE_LABELS[r[1]]){out.layerHdr.forEach((b,bi)=>{(((out.layers[b]=out.layers[b]||{})[lab]=out.layers[b][lab]||{}))[RATE_LABELS[r[1]]]=parseNum(r[2+bi]);});continue;}
    if(lk&&!/^Villa/i.test(lab)){let v=r.slice(1);if(v[0]==="")v=v.slice(1);if(v.some(x=>/%/.test(x)))out.rates[RATE_LABELS[lk]]=v.map(x=>/%/.test(x)?parseNum(x):null);}}
  if(!bnames.length)return null;
  out.brands=bnames.map((b,bi)=>({name:b,values:vals[b]||{},layers:out.layers[b]||null,rates:{freight:out.rates.freight?.[bi],assembly:out.rates.assembly?.[bi],insurance:out.rates.insurance?.[bi]}}));
  return out;}
function parseHam(rows){ // Firma, Villa, Bölüm, Kod, Kalem, Marka, Tip, Toplam, Kalem mi  (Marka is dropped on purpose)
  const out={};if(!rows?.length)return out;const h=rows[0].map(x=>String(x).trim());const ix=k=>h.indexOf(k);
  const F=ix("Firma"),V=ix("Villa"),B=ix("Bölüm"),K=ix("Kod"),N=ix("Kalem"),M=ix("Marka"),T=ix("Tip"),P=ix("Toplam"),Q=ix("Kalem mi");if(F<0||V<0||P<0)return out;
  rows.slice(1).forEach(r=>{if(Q>=0&&!/^true$/i.test(String(r[Q]||"").trim()))return;const f=String(r[F]||"").trim();if(!f)return;const v=String(r[V]||"").trim();
    ((out[f]=out[f]||{})[v]=out[f][v]||[]).push({f:String(r[B]||"").trim(),c:String(r[K]||"").trim(),n:String(r[N]||"").trim(),b:M>=0?String(r[M]||"").trim():"",t:String(r[T]||"").trim(),v:parseNum(r[P])});});
  return out;}
function mergeParsed(p,extraFields){
  const cur=S.cfg||{projectName:"Hayat Mekke",subtitle:"Villa mobilya paketleri",location:"Mekke · Suudi Arabistan",vat:0.15,villaCount:250,fx:3.75,villaMeta:{}};
  const old=Object.fromEntries((cur.brands||[]).map(b=>[b.name,b]));
  // Package names always follow price order with no gaps: cheapest = Silver, next = Gold, …
  // Suppliers that left the sheet free their name; their images are archived so they never show under another package.
  const oldMap={...(S.keys.bySource||{})};
  const tot=b=>p.villas.reduce((s,v)=>{const f=(b.values[v]||[]).reduce((x,y)=>x+(+y||0),0);const la=b.layers?.[v];const r=b.rates||{};
    return s+f+(la?(+la.freight||0)+(+la.assembly||0)+(+la.insurance||0):f*((+r.freight||0)+(+r.assembly||0)+(+r.insurance||0)));},0);
  const order=p.brands.slice().sort((a,b)=>tot(a)-tot(b));
  const map={};order.forEach((b,i)=>map[b.name]=TIERS[i]||("Paket "+(i+1)));
  const byNorm={};for(const [k,n] of Object.entries(map))byNorm[normB(k)]=n;
  const ren={};for(const [src,oldName] of Object.entries(oldMap))ren[oldName]=byNorm[normB(src)]||("Arşiv · "+oldName);
  S._pendingKeys=map;S._renames=ren;
  p.brands=order;
  const brandsN=p.brands.map(b=>{const name=map[b.name];const o=old[oldMap[b.name]]?.rates||{};const r={};["freight","assembly","insurance"].forEach(k=>r[k]=b.rates[k]!=null?b.rates[k]:(+o[k]||0));
    const values={};p.villas.forEach(v=>values[v]=p.sections.map((_,i)=>+(b.values[v]?.[i]||0)));const o2={name,rates:r,values};if(b.layers)o2.layers=b.layers;return o2;});
  return {...cur,...extraFields,villas:p.villas,sections:p.sections,brands:brandsN,vat:p.vat!=null?p.vat:cur.vat,villaCount:p.villaCount||cur.villaCount,fx:p.fx||cur.fx,currency:"USD",updatedAt:new Date().toISOString()};}
async function saveKeys(patch){const k={bySource:{...(S.keys.bySource||{})},sheetId:S.keys.sheetId||"",...patch};await S.db.doc("private/keys").set(k);S.keys=k;}
async function saveCfg(c,msg){try{delete c.sheetId;
  if(S._pendingKeys){await saveKeys({bySource:S._pendingKeys});S._pendingKeys=null;}
  await S.db.doc("config/main").set(c);if(msg)toast(msg);return true;}catch(e){toast(e?.code==="invalid_argument"?"Kaydetme yetkiniz yok":"Kaydedilemedi, tekrar deneyin");return false;}}
function normB(x){return String(x||"").toLocaleLowerCase("tr").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i").replace(/[^a-z0-9]/g,"");}
function brandMasker(map){ // supplier names never reach shared data: a supplier's own brand shows as "<package> koleksiyonu"
  const tok=new Map(),byNorm={};for(const [k,n] of Object.entries(map))byNorm[normB(k)]=n;
  for(const src of new Set([...Object.keys(map),...Object.keys(S.keys.bySource||{})]))src.split("/").forEach(t=>{const n=normB(t);if(n)tok.set(n,src);});
  return b=>{const n=normB(b);if(!n||/markagirilmemis/.test(n))return "";const src=tok.get(n);if(src!==undefined){const nm=map[src]||byNorm[normB(src)];return nm?nm+" koleksiyonu":"Diğer koleksiyon";}return b;};}
async function saveBoq(ham,map){const keep=new Set();const mask=brandMasker(map);
  const byNorm={};for(const [k,n] of Object.entries(map))byNorm[normB(k)]=n;
  for(const [src,vv] of Object.entries(ham)){const name=map[src]||byNorm[normB(src)];if(!name)continue;const id=slug(name);keep.add(id);
    const villasM={};for(const [v,arr] of Object.entries(vv))villasM[v]=arr.map(it=>({...it,b:mask(it.b)}));
    await S.db.doc("boq/"+id).set({package:name,villas:villasM,updatedAt:new Date().toISOString()});}
  for(const id of Object.values(S.boqDocs))if(!keep.has(id)){try{await S.db.doc("boq/"+id).delete();}catch(e){}}}
async function applyRenames(ren,hasHam){ // move image tags (and, without a fresh item list, item lists) to the new package names
  const media=S.media.slice(),docs={...S.boqDocs};
  for(const m of media){const n=m.brand&&ren[m.brand];if(n&&n!==m.brand){try{await S.db.doc("media/"+m.id).update({brand:n});}catch(e){}}}
  if(!hasHam)for(const [oldName,id] of Object.entries(docs)){const n=ren[oldName];if(n&&n!==oldName){try{await S.db.doc("boq/"+id).update({package:n});}catch(e){}}}}
function sheetIdFrom(s){const m=String(s||"").match(/\/d\/([A-Za-z0-9_-]{20,})/);return m?m[1]:String(s||"").trim();}
const payloadRows=res=>{let p=res?.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}return p?.values||p?.valueRange?.values;};
function bindData(m){
  m.querySelector("#syncBtn")?.addEventListener("click",async()=>{const st=m.querySelector("#syncStatus");const id=sheetIdFrom(m.querySelector("#sheetId").value);if(!id){st.textContent="Tablo bağlantısını girin.";return;}
    st.textContent="Google Sheets okunuyor…";
    try{const rows=payloadRows(await S.mcp.callTool("Google Sheets","get_values",{spreadsheetId:id,range:SHEET_RANGE},{cache:false}));
      if(!Array.isArray(rows))throw {message:"Veri sayfası okunamadı"};
      const parsed=parseVeri(rows);if(!parsed)throw {message:"Veri sayfasında 'Villa | Bölüm' tablosu bulunamadı"};
      if(parsed.currency==="SAR")throw {message:"Excel SAR modunda. Özet sayfasında para birimini USD yapıp tekrar çekin"};
      let ham={};try{ham=parseHam(payloadRows(await S.mcp.callTool("Google Sheets","get_values",{spreadsheetId:id,range:HAM_RANGE},{cache:false})));}catch(e){}
      if(id!==S.keys.sheetId){try{await saveKeys({sheetId:id});}catch(e){}}
      const cfg=mergeParsed(parsed,{syncedAt:new Date().toISOString(),source:"sheets"});const map=S._pendingKeys||S.keys.bySource;const ren=S._renames||{};S._renames=null;
      const hasHam=Object.keys(ham).length>0;
      if(await saveCfg(cfg)){await applyRenames(ren,hasHam);if(hasHam)await saveBoq(ham,map);
        const n=Object.values(ham).reduce((a,vv)=>a+Object.values(vv).reduce((x,arr)=>x+arr.length,0),0);
        toast(`${parsed.brands.length} paket, ${parsed.villas.length} villa${n?`, ${n} kalem`:""} güncellendi`);st.textContent="Güncellendi";}}
    catch(e){st.textContent=e?.code==="not_granted"||e?.code==="server_not_connected"?"Google Sheets bağlantısına izin verin ya da bağlayıcıyı claude.ai'de açın.":"Çekilemedi: "+(e?.message||e?.code||"bilinmeyen hata");}});
  if(!S.cfg)return;
  m.querySelector("#saveData").onclick=async()=>{const c=structuredClone(S.cfg);
    c.vat=parseNum(m.querySelector("#dVat").value)/100;c.villaCount=parseNum(m.querySelector("#dCount").value);c.fx=parseNum(m.querySelector("#dFx").value)||3.75;
    const renames={};
    m.querySelectorAll("[data-bname]").forEach(el=>{const b=c.brands[+el.dataset.bname];const n=el.value.trim();if(n&&n!==b.name){renames[b.name]=n;b.name=n;}});
    if(Object.keys(renames).length){const bs={...(S.keys.bySource||{})};for(const k in bs)if(renames[bs[k]])bs[k]=renames[bs[k]];S._pendingKeys=bs;}
    m.querySelectorAll("[data-rate]").forEach(el=>{const [bi,k]=el.dataset.rate.split("|");c.brands[+bi].rates[k]=parseNum(el.value)/100;});
    m.querySelectorAll("[data-val]").forEach(el=>{const [bi,v,si]=el.dataset.val.split("|");const b=c.brands[+bi];b.values[v]=b.values[v]||[];b.values[v][+si]=parseNum(el.value);});
    c.updatedAt=new Date().toISOString();c.source="manual";
    if(await saveCfg(c,"Veriler kaydedildi")&&Object.keys(renames).length){
      S.media.filter(x=>renames[x.brand]).forEach(x=>S.db.doc("media/"+x.id).update({brand:renames[x.brand]}).catch(()=>{}));
      Object.entries(renames).forEach(([o,n])=>{const id=S.boqDocs[o];if(id)S.db.doc("boq/"+id).update({package:n}).catch(()=>{});});}};}
function bindInfo(m){m.querySelector("#saveInfo").onclick=()=>{if(!S.cfg)return;const c=structuredClone(S.cfg);
  c.projectName=m.querySelector("#iName").value.trim()||"Hayat Mekke";c.subtitle=m.querySelector("#iSub").value.trim();c.location=m.querySelector("#iLoc").value.trim();c.intro=m.querySelector("#iIntro").value.trim();
  c.villaMeta=c.villaMeta||{};m.querySelectorAll("[data-vm]").forEach(el=>{const [v,k]=el.dataset.vm.split("|");c.villaMeta[v]=c.villaMeta[v]||{};c.villaMeta[v][k]=el.value.trim();});saveCfg(c,"Bilgiler kaydedildi");};}

/* ---------- boot ---------- */
let renderPending=false;
const typing=()=>document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
function scheduleRender(){
  if(S.view==="admin"&&typing()&&S.admin!=="pins"){renderPending=true;return;}
  if($("#overlay").children.length){renderTabs();renderPending=true;return;}
  const y=window.scrollY;render();window.scrollTo({top:y});}
document.addEventListener("focusout",()=>setTimeout(()=>{if(renderPending&&!typing()&&!$("#overlay").children.length){renderPending=false;scheduleRender();}},50));
new MutationObserver(()=>{if(!$("#overlay").children.length&&renderPending){renderPending=false;scheduleRender();}}).observe($("#overlay"),{childList:true});

(async function boot(){
  const claude=window.claude;
  if(!claude||!claude.use){ // standalone build (GitHub Pages / local): data comes from data/data.js
    const D=window.HM_DATA;if(D){S.cfg=D.config||null;S.media=(D.media||[]).map(m=>({...m}));S.boq=D.boq||{};}
    S.dbReady=true;render();return;}
  const [db,user,assets,mcp]=await Promise.all([claude.use("db"),claude.use("user"),claude.use("assets"),claude.use("mcp")]);
  S.db=db;S.assets=assets;S.mcp=mcp;
  try{S.canEdit=!!(user&&await user.canEdit());}catch(e){}
  if(!S.canEdit&&assets)S.canEdit=true;
  if(!db){S.dbReady=true;render();return;}
  db.doc("config/main").onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.dbReady=true;scheduleRender();},()=>{S.dbReady=true;render();});
  db.collection("media").onSnapshot(q=>{S.media=q.docs.map(d=>({id:d.id,...d.data()}));scheduleRender();},()=>{});
  db.collection("boq").onSnapshot(q=>{const b={},ids={};q.docs.forEach(d=>{const x=d.data();if(x.package){b[x.package]=x.villas||{};ids[x.package]=d.id;}});S.boq=b;S.boqDocs=ids;scheduleRender();},()=>{});
  if(S.canEdit)db.doc("private/keys").onSnapshot(s=>{if(s.exists){const d=s.data();S.keys={bySource:{...(d.bySource||{})},sheetId:d.sheetId||""};}},()=>{});
})();
render();
})();
</script>
